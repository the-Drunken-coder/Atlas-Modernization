services:
  # ATLAS Core API (production image)
  api:
    build:
      context: ../..
      dockerfile: Atlas_Core/docker/Dockerfile
      target: production
    container_name: atlas_core_api
    environment:
      DATABASE_URL: postgres://atlas:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/atlas_core
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_RECYCLE: ${DATABASE_POOL_RECYCLE:-3600}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}
      DATABASE_POOL_IDLE_TIMEOUT: ${DATABASE_POOL_IDLE_TIMEOUT:-600}
      DATABASE_POOL_PRE_PING: ${DATABASE_POOL_PRE_PING:-true}
      DATABASE_RECREATE_ON_STARTUP: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MINIO_BUCKET: atlas-media
      MINIO_SECURE: "false"
      SERVER_PORT: "8000"
      ENABLE_API_AUTH: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://atlasinterface.com}
      CORS_ORIGIN_PATTERNS: ${CORS_ORIGIN_PATTERNS:-https://*.atlas-je0.pages.dev}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      API_AUTH_KEY: ${API_AUTH_KEY:?API_AUTH_KEY must be set}
      # atlas.py and the production entrypoint enforce one admin password source before startup.
      ATLAS_ADMIN_PASSWORD: ${ATLAS_ADMIN_PASSWORD:-}
      ATLAS_ADMIN_PASSWORD_FILE: ${ATLAS_ADMIN_PASSWORD_FILE:-}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
      MAX_VIEW_SIZE_MB: ${MAX_VIEW_SIZE_MB:-10}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - atlas_core_network

  # PostgreSQL runtime scratch store
  postgres:
    image: postgres:15@sha256:1b92e7a80c021647bf70f5d3eb66066a998e4f5cf43c07bb9dc9f729782cf88e
    container_name: atlas_core_postgres
    environment:
      POSTGRES_DB: atlas_core
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: "--auth-local=md5 --auth-host=md5"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set} pg_isready -U atlas -d atlas_core"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atlas_core_network

  # MinIO for object/blob scratch storage
  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z@sha256:4092433a77e510826874b36f369696df43407a763d7f901a61d74e83e6fd95bc
    container_name: atlas_core_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - atlas_core_network

  # MinIO bucket initialization (runs once and exits)
  minio-init:
    image: minio/mc:RELEASE.2024-01-31T08-59-40Z@sha256:c084c9a67c7a9ed5f37cc7f2a905010861aaa882bec76da10352305c9709b6d2
    container_name: atlas_core_minio_init
    restart: "no"
    environment:
      MC_HOST_myminio: http://${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}:${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}@minio:9000
      ENABLE_PUBLIC_MINIO: ${ENABLE_PUBLIC_MINIO:-false}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        mc mb --ignore-existing myminio/atlas-media
        case "$$ENABLE_PUBLIC_MINIO" in true|1|yes|on) mc anonymous set download myminio/atlas-media ;; esac
        echo 'MinIO bucket initialized successfully'
    networks:
      - atlas_core_network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  atlas_core_network:
    driver: bridge
