# Manual/config-file runs only. Substitute before use:
#   export CLOUDFLARED_TUNNEL='<tunnel-uuid>'
#   envsubst '${CLOUDFLARED_TUNNEL}' < config.yml > /tmp/cloudflared-config.yml
# Docker Compose tunnel profile uses CLOUDFLARE_TUNNEL_TOKEN instead (this file is not mounted).
tunnel: ${CLOUDFLARED_TUNNEL}
credentials-file: /etc/cloudflared/credentials/atlas-core.json
protocol: http2
ingress:
  - hostname: atlascommandapi.org
    service: http://api:8000
    originRequest:
      connectTimeout: 10s
  - hostname: api.atlasinterface.com
    service: http://api:8000
    originRequest:
      connectTimeout: 10s
  - hostname: command.atlascommandapi.org
    service: http://api:8000
    originRequest:
      connectTimeout: 10s
  - service: http_status:404
