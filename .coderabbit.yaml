# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: |
  Be direct and skeptical. Prioritize correctness, security, missing tests,
  data loss, contract/artifact drift, concurrency, transactions, CI failures,
  and unintended behavior deletion. Treat style-only notes as secondary.
early_access: true
enable_free_tier: true
inheritance: true

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_instructions: |
    Summarize behavior changes, removed behavior, compatibility-breaking
    choices, test/verification evidence, generated artifact updates, and
    operational risk. Do not pad the summary with generic praise.
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_in_walkthrough: true
  auto_title_placeholder: "@coderabbitai"
  auto_title_instructions: |
    Prefer concise imperative titles that name the changed subsystem and
    the behavior changed.
  review_status: true
  review_details: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true
  abort_on_close: true
  disable_cache: true
  path_filters:
    - "**"
    - "!**/.DS_Store"
    - "!**/coverage.out"
    - "!**/*.log"
    - "!**/*.tmp"
  # Canonical label guidance; issue enrichment reuses this anchor below.
  labeling_instructions: &atlas_labeling_instructions
    - label: "atlas-core"
      instructions: "Suggest for changes under Atlas_Core/."
    - label: "atlas-protocol"
      instructions: "Suggest for changes under atlas_protocol/ or docs/atlas-protocol/."
    - label: "ci"
      instructions: "Suggest for GitHub Actions, Docker, or verification workflow changes."
    - label: "security"
      instructions: "Suggest for authentication, secrets, token scopes, upload handling, or authorization risk."
    - label: "docs"
      instructions: "Suggest for documentation-only changes."
  path_instructions:
    - path: "Atlas_Core/**/*.go"
      instructions: |
        Review as production Go even though the project is greenfield. Be strict
        about correctness, error wrapping, validation gaps, HTTP/API contract
        drift, nil handling, race/concurrency hazards, transaction boundaries,
        retry behavior, cleanup ordering, pagination consistency, SQL safety,
        request body limits, and tests for edge/error paths. Prefer breaking
        cleanups over compatibility shims, but flag accidental behavior deletion
        when tests, handlers, serializers, or docs still imply the behavior exists.
    - path: "Atlas_Core/internal/actions/**"
      instructions: |
        Pay extra attention to business invariants, database transactions,
        row/advisory locks, change-version ordering, tombstones, storage cleanup
        retries, object upload replacement, validation-before-persistence, and
        whether merged JSON blobs are revalidated after mutation.
    - path: "Atlas_Core/internal/api/**"
      instructions: |
        Check request decoding, body limits, status codes, error mapping, auth
        boundaries, pagination headers, ETags/If-Match, upload/download behavior,
        and serializer compatibility with the documented API surface.
    - path: "Atlas_Core/internal/config/**"
      instructions: |
        Check environment-variable precedence, settings-file behavior, Docker
        Compose .env compatibility, secret-file loading, placeholder-secret
        rejection, and whether auth or storage defaults are safe for the stated
        local/development posture.
    - path: "Atlas_Core/internal/database/**"
      instructions: |
        Treat PostgreSQL as disposable runtime scratch storage. Review schema
        changes for boot-time recreate behavior, indexes that match query order,
        deletion tombstones, monotonic versioning, and whether docs/tests reflect
        intentional destructive startup behavior.
    - path: "Atlas_Core/internal/storage/**"
      instructions: |
        Treat MinIO as disposable runtime scratch storage. Review bucket clearing,
        object path generation, stale blob cleanup, upload/download streaming,
        error translation, secret handling, and any wording that implies MinIO is
        a durable system of record.
    - path: "Atlas_Core/docker/**"
      instructions: |
        Review Docker and Compose changes for build-context correctness across
        Atlas_Core/ and atlas_protocol/, required environment variables, .env
        precedence, loopback binding, health checks, production auth posture,
        pinned images, secret exposure, and scratch-storage messaging.
    - path: "Atlas_Core/docs/**"
      instructions: |
        Check docs against live code. Flag stale endpoint behavior, durable-storage
        language for disposable runtime scratch storage, wrong module roots,
        outdated environment variables, and missing verification commands.
    - path: "atlas_protocol/schema/**"
      instructions: |
        Treat draft 2020-12 JSON Schema in
        atlas_protocol/schema/jsonschema/atlas.schema.json as the protocol source
        of truth. Flag incomplete constraints, accidental compatibility aliases,
        schema/example drift, hand-edited generated artifacts, and missing updates
        to generated Go/TypeScript artifacts, protocol tests, and docs.
    - path: "atlas_protocol/tools/**"
      instructions: |
        Review generators for deterministic output, stable ordering, error
        handling, path safety, generated-file freshness, schema coverage, and
        whether reusable generated artifacts remain in atlas_protocol/ rather
        than Atlas_Core/internal/.
    - path: "atlas_protocol/generated/**"
      instructions: |
        Generated artifacts may still reveal generator or schema drift. Check
        whether generated Go, generated TypeScript, examples, and the canonical
        JSON Schema source are mutually consistent.
        Do not ask for hand edits to generated files; ask for generator/schema
        fixes and regeneration.
    - path: "atlas_protocol/protocoltest/**"
      instructions: |
        Review tests for canonical protocol coverage, rejection of legacy aliases,
        raw JSON trailing-data rejection, numeric precision, edge cases, and
        coverage of generated validators.
    - path: "docs/atlas-protocol/**"
      instructions: |
        Planning/reference docs live here. Flag stale links to the old root-level
        Atlas Protocol/ folder, drift from atlas_protocol/ implementation status,
        vague implementation plans, or ownership confusion between Atlas Protocol
        and Atlas Core.
    - path: "docs/design-decisions/**"
      instructions: |
        Treat these as durable project intent. Flag code or docs that contradict
        recorded decisions, especially around greenfield breaking changes,
        disposable storage, object references, and protocol ownership.
    - path: ".github/workflows/**"
      instructions: |
        Review for CI correctness, least-privilege permissions, action pinning,
        branch/base assumptions, working-directory mistakes, module-root commands,
        secret/token exposure, cache poisoning, and whether checks actually cover
        Atlas_Core/ plus atlas_protocol/.
    - path: "**/*_test.go"
      instructions: |
        Tests should assert behavior and failure modes, not implementation trivia.
        Check for missing regression coverage, weak assertions, hidden flakiness,
        untested error paths, time/order nondeterminism, and tests that preserve
        compatibility shims without an explicit design decision.
    - path: "AGENTS.md"
      instructions: |
        Treat this as repo operating policy for agents. Flag stale paths, missing
        project surprises, ambiguity about module roots, or guidance that conflicts
        with current code and design decisions.

  auto_review:
    enabled: false
    description_keyword: ""
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 50
    ignore_title_keywords: []
    labels: []
    drafts: true
    base_branches:
      - ".*"
    ignore_usernames: []

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: true
    custom:
      - enabled: true
        name: "tighten tests"
        instructions: |
          Add or strengthen focused tests for the changed behavior, especially
          validation failures, deleted behavior, race-prone paths, generated
          artifact drift, and storage/database cleanup edge cases.
      - enabled: true
        name: "remove compatibility bloat"
        instructions: |
          Remove backwards-compatibility shims, stale aliases, and unused code
          when no design decision requires them. Keep the patch narrow and update
          tests/docs to the canonical behavior.
      - enabled: true
        name: "verify generated artifacts"
        instructions: |
          Reconcile schema, generator, generated Go, TypeScript, examples, and
          protocol tests. Prefer source/generator fixes over hand-editing generated
          output.

  pre_merge_checks:
    override_requested_reviewers_only: false
    docstrings:
      mode: "warning"
      threshold: 80
    title:
      mode: "error"
      requirements: |
        Title must be concise, imperative, and name the subsystem or behavior
        changed. Avoid generic titles such as "fix review comments".
    description:
      mode: "error"
    issue_assessment:
      mode: "warning"
    custom_checks:
      - mode: "error"
        name: "Verification evidence"
        instructions: |
          The PR must state the relevant verification that was run, or explicitly
          explain why it was not run. For Go changes this should include
          Atlas_Core `go test ./...` and/or atlas_protocol `go test ./...` plus
          `go run ./tools/check` when protocol artifacts are touched.
      - mode: "error"
        name: "Protocol artifact freshness"
        instructions: |
          If atlas_protocol/schema, atlas_protocol/tools, or generated protocol
          artifacts change, the PR must keep canonical JSON Schema, generated
          Go, generated TypeScript, examples, and protocol tests consistent. Flag
          stale generated output or hand edits that should have come from the
          generator.
      - mode: "error"
        name: "Module boundary"
        instructions: |
          Atlas_Core is the Go service module root. atlas_protocol is the buildable
          sibling protocol module. Flag commands, imports, Docker contexts, or docs
          that blur those boundaries or move protocol source into Atlas_Core/internal.
      - mode: "error"
        name: "Scratch storage posture"
        instructions: |
          PostgreSQL and MinIO are disposable runtime scratch storage in this repo.
          Flag docs, logs, startup behavior, or review text that implies they are
          durable systems of record.
      - mode: "error"
        name: "Greenfield cleanup"
        instructions: |
          Because there are no users or real data yet, flag unnecessary compatibility
          shims, migrations for nonexistent deployments, and stale aliases unless a
          current design decision explicitly requires them.
      - mode: "error"
        name: "Deleted behavior"
        instructions: |
          When a PR deletes functions, files, fields, endpoints, env vars, or tests,
          verify that callers, docs, generated artifacts, examples, and tests were
          updated intentionally. Flag accidental orphaned references or untested
          removals.
      - mode: "error"
        name: "Security and secrets"
        instructions: |
          Flag leaked credentials, weak auth defaults outside local/dev posture,
          unsafe token permissions, unbounded request bodies, upload/download
          exposure, shell injection risk, and unsafe CI permissions.
      - mode: "error"
        name: "CI coverage"
        instructions: |
          If the PR changes CI, Docker, Go modules, generated artifacts, or runtime
          startup behavior, the verification must cover the affected module roots
          and configuration surfaces rather than only compiling one package.

  # Keep broad analyzer coverage while Atlas is greenfield. If review latency or
  # noise gets excessive, trim docs/style tools first: languagetool,
  # markdownlint, and presidio.
  tools:
    ast-grep:
      essential_rules: true
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 900000
    languagetool:
      enabled: true
      level: "picky"
    hadolint:
      enabled: true
    golangci-lint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    checkov:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    opengrep:
      enabled: true
    semgrep:
      enabled: true
    sqlfluff:
      enabled: true
    trivy:
      enabled: true
    dotenvLint:
      enabled: true
    checkmake:
      enabled: true
    osvScanner:
      enabled: true
    presidio:
      enabled: true

chat:
  art: false
  allow_non_org_members: false
  auto_reply: true
  integrations:
    jira:
      usage: "auto"
    linear:
      usage: "auto"

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "README.md"
      - "Atlas_Core/README.md"
      - "Atlas_Core/docs/**/*.md"
      - "atlas_protocol/README.md"
      - "docs/atlas-protocol/**/*.md"
      - "docs/design-decisions/**/*.md"
  learnings:
    scope: "local"
    approval_delay: 0
  issues:
    scope: "local"
  jira:
    usage: "auto"
    project_keys: []
  linear:
    usage: "auto"
    team_keys: []
  pull_requests:
    scope: "local"
  mcp:
    usage: "auto"
    disabled_servers: []
  automatic_repository_linking: false
  linked_repositories: []

code_generation:
  docstrings:
    language: "en-US"
    path_instructions:
      - path: "Atlas_Core/**/*.go"
        instructions: |
          Generate docstrings only when they clarify exported behavior, invariants,
          concurrency, validation, or operational risk. Do not add empty narration.
  unit_tests:
    path_instructions:
      - path: "Atlas_Core/**/*.go"
        instructions: |
          Prefer focused Go tests that cover behavior, edge cases, validation
          failures, transaction/storage cleanup paths, and API contract regressions.
      - path: "atlas_protocol/**"
        instructions: |
          Prefer tests that prove canonical JSON Schema, generated Go, generated
          TypeScript, raw JSON validators, examples, and artifact freshness stay
          aligned.

issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    enabled: true
    auto_planning:
      enabled: true
      labels: []
  labeling:
    labeling_instructions: *atlas_labeling_instructions
    auto_apply_labels: false
