name: atlas_core_production

services:
  # Standalone durable PostgreSQL service for atlas.py --production --db-only.
  # Keeping unrelated production services out of this model lets Compose
  # interpolate it without requiring unused API or MinIO credentials.
  postgres:
    image: postgres:15@sha256:1b92e7a80c021647bf70f5d3eb66066a998e4f5cf43c07bb9dc9f729782cf88e
    container_name: atlas_core_production_postgres
    environment:
      POSTGRES_DB: atlas_core
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: "--auth-local=md5 --auth-host=md5"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" pg_isready -U atlas -d atlas_core"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atlas_core_network

volumes:
  postgres_data:
    driver: local

networks:
  atlas_core_network:
    driver: bridge
