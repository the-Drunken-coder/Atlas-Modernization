services:
  api:
    environment:
      ENABLE_API_AUTH: "true"
      API_AUTH_KEY: ${API_AUTH_KEY:?API_AUTH_KEY must be set for tunnel mode}
      # Only the pinned cloudflared peer may supply browser-client IP headers.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.0.3/32}
    networks:
      atlas_core_network:
      atlas_tunnel_network:
        ipv4_address: 172.30.0.2

  # Cloudflare Tunnel for public HTTPS access (token-managed; see docker/cloudflared/README.md).
  cloudflared:
    image: cloudflare/cloudflared:2026.5.2@sha256:12ff5c6992a9863db4da270746af7c244bcaee49353039af8104268a18d6c4f0
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set}
    depends_on:
      api:
        condition: service_healthy
    networks:
      atlas_tunnel_network:
        ipv4_address: 172.30.0.3

networks:
  # Dedicated ingress bridge: only Core and its trusted tunnel peer join it.
  atlas_tunnel_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/29
