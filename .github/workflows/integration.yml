name: Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: atlas_core/go.mod
  GO_SUM_FILE: atlas_core/go.sum
  WORKING_DIRECTORY: atlas_core
  ATLAS_CORE_API_URL: http://localhost:8000
  MINIO_ROOT_PASSWORD: atlas-ci
  POSTGRES_PASSWORD: atlas
  MINIO_ROOT_USER: atlas
  CLOUDFLARE_TUNNEL_TOKEN: dummy
  ATLAS_CORE_REQUIRE_LIVE_TESTS: "1"
  ENABLE_API_AUTH: "true"
  API_AUTH_KEY: atlas-ci-api-key
  ATLAS_API_AUTH_KEY: atlas-ci-api-key
  ATLAS_ADMIN_PASSWORD: atlas-ci-admin-password

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_SUM_FILE }}

      - name: Start Atlas Core stack
        run: docker compose -f docker/docker-compose.yml up -d --build

      - name: Verify command catalog on fresh startup and API-only restart
        run: ATLAS_API_AUTH_KEY='' API_AUTH_KEY='' ./scripts/test_development_restart.sh

      - name: Run shell API integration tests
        run: ./scripts/run_integration_tests.sh

      - name: Run full Go test suite against live stack
        run: go test -count=1 ./...

      - name: Collect Compose logs
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --no-color

      - name: Tear down Atlas Core stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v --remove-orphans

  production-persistence:
    name: production-persistence
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify durable production clean install, restart, and paired restore
        run: ./scripts/test_production_persistence.sh
