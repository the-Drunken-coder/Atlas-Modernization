name: Prune Workflow Runs

on:
  workflow_dispatch:
  schedule:
    # Run shortly before Nightly's 08:23 UTC schedule so cleanup does not overlap
    # the repository's heavier nightly validation window.
    - cron: "0 8 * * *"

permissions:
  actions: write

concurrency:
  group: prune-workflow-runs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Prune old workflow runs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // This workflow prunes completed workflow runs older than the retention
            // window across all workflows.
            const allowedStatuses = new Set(['completed']);
            const retentionDays = 14;
            const cutoff = new Date(Date.now() - retentionDays * 24 * 60 * 60 * 1000);
            const perPage = 100;

            const runsToDelete = [];

            for (let page = 1;; page += 1) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: perPage,
                page,
              });

              const runs = response.data.workflow_runs;
              if (!runs.length) {
                break;
              }

              runs.forEach((run) => {
                if (!allowedStatuses.has(run.status)) {
                  return;
                }

                // Skip the current run because GitHub cannot delete it while it is running.
                if (run.id === context.runId) {
                  return;
                }

                const createdAt = new Date(run.created_at);
                if (Number.isNaN(createdAt.valueOf()) || createdAt >= cutoff) {
                  return;
                }

                runsToDelete.push(run.id);
              });
            }

            if (!runsToDelete.length) {
              core.info(`No completed workflow runs older than ${retentionDays} days found to delete.`);
              return;
            }

            const deletedRuns = [];
            for (const runId of runsToDelete) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId,
                });

                deletedRuns.push(runId);
              } catch (err) {
                // Log but continue because some runs might be protected or already deleted.
                core.warning(`Failed to delete run ${runId}: ${err.message}`);
              }
            }

            core.info(`Deleted ${deletedRuns.length} workflow run(s).`);
            core.info(`Run IDs removed: ${deletedRuns.join(', ')}`);
