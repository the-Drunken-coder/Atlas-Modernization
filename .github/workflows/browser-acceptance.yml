name: Browser Acceptance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: browser-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: browser-smoke-${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - webkit
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript workspace dependencies
        run: npm ci

      - name: Install ${{ matrix.browser }} and system dependencies
        run: timeout 10m node node_modules/playwright/cli.js install --with-deps ${{ matrix.browser }}

      - name: Run ${{ matrix.browser }} browser acceptance
        env:
          ATLAS_ACCEPTANCE_RUN_LABEL: ci-${{ matrix.browser }}
        run: npm run test:acceptance:browser-smoke -- --browser=${{ matrix.browser }}

      - name: Upload browser acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .atlas/acceptance/browser-smoke-${{ matrix.browser }}/
          if-no-files-found: error
          retention-days: 14
