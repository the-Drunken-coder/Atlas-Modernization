name: CI

on:
  pull_request:
    branches:
      - main
      - planning/sdk-change-feed-protocol
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: Atlas_Core/go.mod
  GO_SUM_FILE: Atlas_Core/go.sum
  PROTOCOL_GO_VERSION_FILE: atlas_protocol/go.mod
  PROTOCOL_GO_SUM_FILE: atlas_protocol/go.sum
  PROTOCOL_WORKING_DIRECTORY: atlas_protocol
  SDK_WORKING_DIRECTORY: atlas_sdk
  WORKING_DIRECTORY: Atlas_Core

jobs:
  go-quality:
    name: go-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_SUM_FILE }}

      - name: Download Go modules
        run: go mod download

      - name: Check Go formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'gofmt is required for:\n%s\n' "$files"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: v2.12.2
          working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Run Go tests with race detector
        run: go test -race -coverprofile=coverage.out ./...

  atlas-protocol:
    name: atlas-protocol
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROTOCOL_WORKING_DIRECTORY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ${{ env.PROTOCOL_GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.PROTOCOL_GO_SUM_FILE }}

      - name: Download Atlas Protocol Go modules
        run: go mod download

      - name: Check Atlas Protocol Go formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'gofmt is required for:\n%s\n' "$files"
            exit 1
          fi

      - name: Run Atlas Protocol go vet
        run: go vet ./...

      - name: Run Atlas Protocol golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: v2.12.2
          working-directory: ${{ env.PROTOCOL_WORKING_DIRECTORY }}

      - name: Check Atlas Protocol artifacts
        run: go run ./tools/check

      - name: Run Atlas Protocol tests
        run: go test ./...

      - name: Regenerate Atlas Protocol artifacts
        run: go run ./tools/generate

      - name: Verify generated Atlas Protocol artifacts are checked in
        run: |
          git diff --exit-code -- generated
          untracked="$(git ls-files --others --exclude-standard generated)"
          if [ -n "$untracked" ]; then
            printf 'untracked generated Atlas Protocol artifacts:\n%s\n' "$untracked"
            exit 1
          fi

  atlas-sdk:
    name: atlas-sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SDK_WORKING_DIRECTORY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ env.SDK_WORKING_DIRECTORY }}/package-lock.json

      - name: Install SDK dependencies
        run: npm ci

      - name: Install browser test runtime
        run: npx --no-install playwright install --with-deps chromium

      - name: Build Atlas SDK
        run: npm run build

      - name: Verify Atlas SDK package output
        run: |
          missing=0
          test -d dist/atlas_sdk/src || { echo "::error::missing dist/atlas_sdk/src"; missing=1; }
          test -f dist/atlas_sdk/src/index.js || { echo "::error::missing dist/atlas_sdk/src/index.js"; missing=1; }
          test -f dist/atlas_sdk/src/index.d.ts || { echo "::error::missing dist/atlas_sdk/src/index.d.ts"; missing=1; }
          test -f dist/atlas_sdk/src/cli.js || { echo "::error::missing dist/atlas_sdk/src/cli.js"; missing=1; }
          test -f dist/atlas_sdk/src/cli.d.ts || { echo "::error::missing dist/atlas_sdk/src/cli.d.ts"; missing=1; }
          test -d dist/atlas_protocol/generated/typescript || { echo "::error::missing dist/atlas_protocol/generated/typescript"; missing=1; }
          test -f dist/atlas_protocol/generated/typescript/index.js || { echo "::error::missing dist/atlas_protocol/generated/typescript/index.js"; missing=1; }
          test -f dist/atlas_protocol/generated/typescript/index.d.ts || { echo "::error::missing dist/atlas_protocol/generated/typescript/index.d.ts"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          node scripts/verify-package-entrypoints.js

      - name: Smoke test Atlas SDK CLI binary
        run: npm run test:bin

      - name: Run Atlas SDK Node tests
        run: npm run test:node

      - name: Run Atlas SDK browser tests
        run: npm run test:browser

  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_SUM_FILE }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      - name: Build Atlas Core
        run: go build ./cmd/atlas_core

      - name: Validate JSON files
        run: |
          find . \
            -name '*.json' \
            -not -path './vendor/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 -n1 jq empty

      - name: Compile Python scripts
        run: |
          if compgen -G "scripts/*.py" > /dev/null; then
            python3 -m py_compile scripts/*.py
          else
            echo "No Python scripts found under scripts/; skipping."
          fi

      - name: Test compose env script
        run: python3 scripts/test_compose_env.py

      - name: Test atlas script helpers
        run: python3 scripts/test_atlas.py

      - name: Test seed command catalog
        run: python3 scripts/test_seed_command_catalog.py

      - name: Run ShellCheck
        run: |
          if compgen -G "scripts/*.sh" > /dev/null; then
            shellcheck scripts/*.sh
          else
            echo "No shell scripts found under scripts/; skipping."
          fi

      - name: Validate Docker Compose config
        env:
          POSTGRES_PASSWORD: atlas-ci
          MINIO_ROOT_USER: atlas
          MINIO_ROOT_PASSWORD: atlas-ci
          CLOUDFLARE_TUNNEL_TOKEN: dummy
          API_AUTH_KEY: dummy-ci-api-auth-key
        run: docker compose -f docker/docker-compose.yml config --quiet

      - name: Validate Docker Compose tunnel overlay config
        env:
          POSTGRES_PASSWORD: atlas-ci
          MINIO_ROOT_USER: atlas
          MINIO_ROOT_PASSWORD: atlas-ci
          CLOUDFLARE_TUNNEL_TOKEN: dummy
          API_AUTH_KEY: dummy-ci-api-auth-key
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.tunnel.yml config --quiet

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Build development image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Atlas_Core/docker/Dockerfile
          target: development
          push: false

      - name: Build production image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Atlas_Core/docker/Dockerfile
          target: production
          push: false
