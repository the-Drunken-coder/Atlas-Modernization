name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: services/core/go.mod
  GO_SUM_FILE: services/core/go.sum
  PROTOCOL_GO_VERSION_FILE: packages/protocol/go.mod
  PROTOCOL_GO_SUM_FILE: packages/protocol/go.sum
  PROTOCOL_WORKING_DIRECTORY: packages/protocol
  WORKING_DIRECTORY: services/core

jobs:
  workflow-validation:
    name: workflow-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_SUM_FILE }}

      - name: Run actionlint over all workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11

  go-quality:
    name: go-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_SUM_FILE }}

      - name: Download Go modules
        run: go mod download

      - name: Check Go formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'gofmt is required for:\n%s\n' "$files"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Check for unreachable Go functions
        run: |
          output="$(go run golang.org/x/tools/cmd/deadcode@v0.48.0 -test ./...)"
          if [ -n "$output" ]; then
            printf 'unreachable Go functions:\n%s\n' "$output"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Run Go tests with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Enforce Go coverage ratchets
        run: python3 scripts/check_coverage.py coverage.out

  atlas-protocol:
    name: atlas-protocol
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROTOCOL_WORKING_DIRECTORY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.PROTOCOL_GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.PROTOCOL_GO_SUM_FILE }}

      - name: Download Atlas Protocol Go modules
        run: go mod download

      - name: Check Atlas Protocol Go formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'gofmt is required for:\n%s\n' "$files"
            exit 1
          fi

      - name: Run Atlas Protocol go vet
        run: go vet ./...

      - name: Run Atlas Protocol golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: ${{ env.PROTOCOL_WORKING_DIRECTORY }}

      - name: Check Atlas Protocol artifacts
        run: go run ./tools/check

      - name: Run Atlas Protocol tests
        run: go test ./...

      - name: Regenerate Atlas Protocol artifacts
        run: go run ./tools/generate

      - name: Verify generated Atlas Protocol artifacts are checked in
        run: |
          git diff --exit-code -- generated
          untracked="$(git ls-files --others --exclude-standard generated)"
          if [ -n "$untracked" ]; then
            printf 'untracked generated Atlas Protocol artifacts:\n%s\n' "$untracked"
            exit 1
          fi

  atlas-sdk:
    name: atlas-sdk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript workspace dependencies
        run: npm ci

      - name: Verify generated Atlas SDK package metadata is checked in
        run: git diff --exit-code -- packages/sdk/src/package-metadata.ts

      - name: Audit JavaScript workspace dependencies
        run: npm audit --audit-level=high

      - name: Lint Atlas SDK
        run: npm run lint --workspace @the-drunken-coder/atlas-sdk

      - name: Check formatting and import order of Atlas SDK
        run: npm run format:check --workspace @the-drunken-coder/atlas-sdk

      - name: Install browser test runtime
        run: timeout 10m node node_modules/playwright/cli.js install chromium

      - name: Build Atlas SDK
        run: npm run build:sdk

      - name: Verify Atlas SDK package output
        run: node packages/sdk/scripts/verify-package-entrypoints.js

      - name: Smoke test packed Atlas SDK consumer
        run: npm run test:package --workspace @the-drunken-coder/atlas-sdk

      - name: Run Atlas SDK type contract tests
        run: npm run test:types --workspace @the-drunken-coder/atlas-sdk

      - name: Run Atlas SDK Node tests with coverage ratchet
        run: npm run test:coverage --workspace @the-drunken-coder/atlas-sdk

      - name: Run Atlas SDK browser tests
        run: npm run test:browser --workspace @the-drunken-coder/atlas-sdk

  atlas-core-package:
    name: atlas-core-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript workspace dependencies
        run: npm ci

      - name: Check Atlas Core npm package
        run: npm run check --workspace atlas-core

      - name: Test Atlas Core release validation
        run: node --test .github/scripts/atlas-core-release.test.mjs

      - name: Validate packaged Docker Compose topology
        shell: bash
        run: |
          set -o pipefail
          config_dir="$(mktemp -d)"
          trap 'rm -rf -- "$config_dir"' EXIT
          cp surfaces/core-cli/test/compose.env "$config_dir/.env"
          image="ghcr.io/the-drunken-coder/atlas-core:$(node -p "require('./surfaces/core-cli/package.json').version")"
          config_json="$(
            ATLAS_CORE_IMAGE="$image" docker compose \
              --project-name atlas_core_production \
              --env-file "$config_dir/.env" \
              --file surfaces/core-cli/assets/docker-compose.yml \
              config --format json
          )"
          jq -e --arg image "$image" '
                .services.api.image == $image and
                .services.api.environment.DATABASE_RECREATE_ON_STARTUP == "false" and
                .services.api.environment.CORS_ORIGINS == "https://atlasinterface.com" and
                .services.api.environment.CORS_ORIGIN_PATTERNS == "https://*.atlas-je0.pages.dev" and
                all(.services.api.ports[]; .host_ip == "127.0.0.1") and
                all(.services.postgres.ports[]; .host_ip == "127.0.0.1") and
                all(.services.minio.ports[]; .host_ip == "127.0.0.1")
              ' <<< "$config_json"
          empty_cors_config="$(
            CORS_ORIGINS='' CORS_ORIGIN_PATTERNS='' ATLAS_CORE_IMAGE="$image" docker compose \
              --project-name atlas_core_production \
              --env-file "$config_dir/.env" \
              --file surfaces/core-cli/assets/docker-compose.yml \
              config --format json
          )"
          jq -e '
            .services.api.environment.CORS_ORIGINS == "" and
            .services.api.environment.CORS_ORIGIN_PATTERNS == ""
          ' <<< "$empty_cors_config"

  fieldlink:
    name: fieldlink
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript workspace dependencies
        run: npm ci

      - name: Check FieldLink
        run: npm run check --workspace atlas-fieldlink

  javascript-clean-workspace:
    name: javascript-clean-workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Exercise direct consumer commands from a clean workspace
        run: node tests/clean-workspace-smoke.mjs

  atlas-command-interface:
    name: atlas-command-interface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript workspace dependencies
        run: npm ci

      - name: Lint command interface
        run: npm run lint --workspace @the-drunken-coder/atlas-command-interface

      - name: Check formatting and import order of command interface
        run: npm run format:check --workspace @the-drunken-coder/atlas-command-interface

      - name: Type-check command interface
        run: npm run typecheck --workspace @the-drunken-coder/atlas-command-interface

      - name: Test command interface with coverage ratchet
        run: npm run test:coverage --workspace @the-drunken-coder/atlas-command-interface

      - name: Build command interface
        run: npm run build --workspace @the-drunken-coder/atlas-command-interface

      - name: Check command-interface bundle budget
        run: npm run check:bundle --workspace @the-drunken-coder/atlas-command-interface -- --skip-build

  atlas-simulations:
    name: atlas-simulations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript workspace dependencies
        run: npm ci

      - name: Lint simulations
        run: npm run lint --workspace @the-drunken-coder/atlas-simulations

      - name: Check formatting and import order of simulations
        run: npm run format:check --workspace @the-drunken-coder/atlas-simulations

      - name: Type-check simulations
        run: npm run typecheck --workspace @the-drunken-coder/atlas-simulations

      - name: Test simulations with coverage ratchet
        run: npm run test:coverage --workspace @the-drunken-coder/atlas-simulations

      - name: Build simulations
        run: npm run build --workspace @the-drunken-coder/atlas-simulations

  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_SUM_FILE }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      - name: Build Atlas Core
        run: go build ./cmd/atlas_core

      - name: Validate JSON files
        run: |
          find . \
            -name '*.json' \
            -not -path './vendor/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 -n1 jq empty

      - name: Compile Python scripts
        run: |
          if compgen -G "scripts/*.py" > /dev/null; then
            python3 -m py_compile scripts/*.py
          else
            echo "No Python scripts found under scripts/; skipping."
          fi

      - name: Lint Python scripts
        run: |
          pip install ruff==0.15.22
          ruff check scripts/
          ruff format --check scripts/

      - name: Test compose env script
        run: python3 scripts/test_compose_env.py

      - name: Test atlas script helpers
        run: python3 scripts/test_atlas.py

      - name: Test Go coverage checker
        run: python3 scripts/test_check_coverage.py

      - name: Run ShellCheck
        run: |
          if compgen -G "scripts/*.sh" > /dev/null; then
            shellcheck scripts/*.sh
          else
            echo "No shell scripts found under scripts/; skipping."
          fi

      - name: Validate Docker Compose config
        env:
          POSTGRES_PASSWORD: atlas-ci
          MINIO_ROOT_USER: atlas
          MINIO_ROOT_PASSWORD: atlas-ci
          CLOUDFLARE_TUNNEL_TOKEN: dummy
          API_AUTH_KEY: dummy-ci-api-auth-key
        run: docker compose -f docker/docker-compose.yml config --quiet

      - name: Validate Docker Compose tunnel overlay config
        env:
          POSTGRES_PASSWORD: atlas-ci
          MINIO_ROOT_USER: atlas
          MINIO_ROOT_PASSWORD: atlas-ci
          CLOUDFLARE_TUNNEL_TOKEN: dummy
          API_AUTH_KEY: dummy-ci-api-auth-key
        run: |
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.tunnel.yml config --quiet
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.tunnel.yml config --format json |
            jq -e '
              .services.api.environment.TRUSTED_PROXY_CIDRS == (.services.cloudflared.networks.atlas_tunnel_network.ipv4_address + "/32") and
              .services.api.environment.DATABASE_URL == "postgres://atlas:atlas-ci@postgres:5432/atlas_core" and
              .services.api.environment.MINIO_ENDPOINT == "minio:9000" and
              (.services.api.networks | keys == ["atlas_core_network", "atlas_tunnel_network"]) and
              (.services.api.networks | has("atlas_core_network")) and
              .services.api.networks.atlas_tunnel_network.ipv4_address == "172.30.0.2" and
              (.services.cloudflared.networks | keys == ["atlas_tunnel_network"]) and
              .services.cloudflared.networks.atlas_tunnel_network.ipv4_address == "172.30.0.3" and
              .networks.atlas_tunnel_network.ipam.config[0].subnet == "172.30.0.0/29" and
              (.services.cloudflared.networks | has("atlas_core_network") | not) and
              (.services.postgres.networks | has("atlas_tunnel_network") | not) and
              (.services.minio.networks | has("atlas_tunnel_network") | not)
            '

      - name: Validate production Docker Compose topologies
        env:
          POSTGRES_PASSWORD: atlas-ci
          MINIO_ROOT_USER: atlas
          MINIO_ROOT_PASSWORD: atlas-ci
          CLOUDFLARE_TUNNEL_TOKEN: dummy
          API_AUTH_KEY: dummy-ci-api-auth-key
          ATLAS_ADMIN_PASSWORD: dummy-ci-admin-password
        run: |
          docker compose -f docker/docker-compose.production.yml config --quiet
          docker compose -f docker/docker-compose.production-db.yml config --quiet
          docker compose -f docker/docker-compose.production.yml config --format json |
            jq -e '
              .services.api.environment.TRUSTED_PROXY_CIDRS == "" and
              (.services | has("cloudflared") | not) and
              (.networks | has("atlas_tunnel_network") | not)
            '
          MINIO_BUCKET=mission-media docker compose -f docker/docker-compose.production.yml config --format json |
            jq -e '
              .services.api.environment.MINIO_BUCKET == "mission-media" and
              .services["minio-init"].environment.MINIO_BUCKET == "mission-media"
            '
          docker compose -f docker/docker-compose.production.yml -f docker/docker-compose.tunnel.yml config --quiet
          docker compose -f docker/docker-compose.production.yml -f docker/docker-compose.tunnel.yml config --format json |
            jq -e '
              .services.api.environment.TRUSTED_PROXY_CIDRS == (.services.cloudflared.networks.atlas_tunnel_network.ipv4_address + "/32") and
              .services.api.environment.DATABASE_URL == "postgres://atlas:atlas-ci@postgres:5432/atlas_core" and
              .services.api.environment.MINIO_ENDPOINT == "minio:9000" and
              (.services.api.networks | keys == ["atlas_core_network", "atlas_tunnel_network"]) and
              (.services.api.networks | has("atlas_core_network")) and
              .services.api.networks.atlas_tunnel_network.ipv4_address == "172.30.0.2" and
              (.services.cloudflared.networks | keys == ["atlas_tunnel_network"]) and
              .services.cloudflared.networks.atlas_tunnel_network.ipv4_address == "172.30.0.3" and
              .networks.atlas_tunnel_network.ipam.config[0].subnet == "172.30.0.0/29" and
              (.services.cloudflared.networks | has("atlas_core_network") | not) and
              (.services.postgres.networks | has("atlas_tunnel_network") | not) and
              (.services.minio.networks | has("atlas_tunnel_network") | not)
            '

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build development image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: services/core/docker/Dockerfile
          target: development
          push: false

      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: services/core/docker/Dockerfile
          target: production
          push: false
