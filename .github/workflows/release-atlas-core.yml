name: Release Atlas Core

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without a leading v, for example 0.1.0
        required: true
        type: string
      recover_existing_release:
        description: Resume an existing exact release without moving its immutable tag
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-atlas-core
  cancel-in-progress: false
  queue: max

env:
  GO_VERSION_FILE: services/core/go.mod
  GO_SUM_FILE: services/core/go.sum
  NPM_VERSION: 11.6.2
  OPENCODE_VERSION: 1.18.21
  OPENCODE_MODEL: opencode-go/gpt-5.6-luna

jobs:
  changelog:
    name: Plan and draft isolated changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.phase.outputs.mode }}
      recovery: ${{ steps.phase.outputs.recovery }}
      source_sha: ${{ steps.phase.outputs.source_sha }}
      release_sha: ${{ steps.phase.outputs.release_sha }}
      release_date: ${{ steps.release.outputs.release_date }}
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Validate and select release phase
        id: phase
        env:
          RECOVER_EXISTING_RELEASE: ${{ inputs.recover_existing_release }}
          VERSION: ${{ inputs.version }}
        run: |
          node .github/scripts/atlas-core-release.mjs validate-version "$VERSION"
          current_version="$(node -p "require('./surfaces/core-cli/package.json').version")"
          node .github/scripts/atlas-core-release.mjs validate-next-version "$current_version" "$VERSION"
          latest_tag="$(git tag --list 'atlas-core-v*' --sort=-version:refname | head -n 1)"
          if [ -n "$latest_tag" ]; then
            node .github/scripts/atlas-core-release.mjs \
              validate-next-version "${latest_tag#atlas-core-v}" "$VERSION"
          fi
          expected_tag="refs/tags/atlas-core-v$VERSION"
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$GITHUB_REF" != "$expected_tag" ]; then
            echo "Dispatch Atlas Core releases from main or $expected_tag." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "The checked-out commit does not match the dispatched commit." >&2
            exit 1
          fi
          git fetch origin main --tags
          bash .github/scripts/select-atlas-core-release-phase.sh

      - name: Select changelog date
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          existing_date="$(node .github/scripts/atlas-core-release.mjs existing-date "$VERSION")"
          if [ -n "$existing_date" ]; then
            echo "already_prepared=true" >> "$GITHUB_OUTPUT"
            echo "release_date=$existing_date" >> "$GITHUB_OUTPUT"
          else
            echo "already_prepared=false" >> "$GITHUB_OUTPUT"
            echo "release_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build factual changelog context
        if: steps.phase.outputs.mode == 'prepare' && steps.release.outputs.already_prepared == 'false'
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ steps.release.outputs.release_date }}
        run: |
          previous_tag="$(git tag --list 'atlas-core-v*' --sort=-version:refname | head -n 1)"
          {
            echo "# Atlas Core release context"
            echo
            echo "Version: $VERSION"
            echo "Release date: $RELEASE_DATE"
            echo "Previous Atlas Core tag: ${previous_tag:-none}"
            echo
            echo "## Relevant commits"
            if [ -n "$previous_tag" ]; then
              git log --format='- %h %s' "$previous_tag..HEAD" -- \
                surfaces/core-cli services/core packages/protocol .github/workflows/release-atlas-core.yml
            else
              git log --max-count=100 --format='- %h %s' -- \
                surfaces/core-cli services/core packages/protocol .github/workflows/release-atlas-core.yml
            fi
            echo
            echo "## Relevant changed files"
            if [ -n "$previous_tag" ]; then
              git diff --name-status "$previous_tag..HEAD" -- \
                surfaces/core-cli services/core packages/protocol .github/workflows/release-atlas-core.yml
            else
              git ls-files surfaces/core-cli services/core packages/protocol .github/workflows/release-atlas-core.yml
            fi
          } > .atlas-core-release-context.md

      - name: Write changelog with OpenCode Go
        if: steps.phase.outputs.mode == 'prepare' && steps.release.outputs.already_prepared == 'false'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_DISABLE_AUTOUPDATE: "true"
          OPENCODE_DISABLE_DEFAULT_PLUGINS: "true"
          OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
          OPENCODE_PERMISSION: '{"bash":"deny","task":"deny","webfetch":"deny","websearch":"deny","question":"deny","edit":"allow","read":"allow","glob":"allow","grep":"allow","list":"allow","external_directory":"deny"}'
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ steps.release.outputs.release_date }}
        run: |
          prompt="$(cat <<EOF
          Edit CHANGELOG.md and no other file.

          Add a release section whose exact heading is:
          ## $VERSION - $RELEASE_DATE

          Keep every existing byte of CHANGELOG.md in place. If it has no existing release heading that starts with
          '## ', append the new section after the existing title and introduction with exactly one blank line before
          the new release heading. Otherwise, insert it immediately before the first existing release heading. Never
          place it before '# Changelog'.

          Read .atlas-core-release-context.md and the relevant repository files. Write concise operator-facing
          release notes using only facts you can verify. Use Markdown bullets. Add Added, Changed, Fixed, or Security
          subheadings only when they help. Mention commands, installation, storage safety, compatibility, and release
          behavior when they changed. Do not invent claims, use placeholders, discuss internal test work, or rewrite
          older release sections. Do not run commands. Stop after editing CHANGELOG.md.
          EOF
          )"
          npx --yes "opencode-ai@$OPENCODE_VERSION" run \
            --pure \
            --model "$OPENCODE_MODEL" \
            --title "Atlas Core $VERSION changelog" \
            "$prompt"

      - name: Validate isolated changelog
        if: steps.phase.outputs.mode == 'prepare'
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ steps.release.outputs.release_date }}
          ALREADY_PREPARED: ${{ steps.release.outputs.already_prepared }}
        run: |
          rm -f .atlas-core-release-context.md
          if [ "$ALREADY_PREPARED" = "false" ]; then
            changed="$(git diff --name-only)"
            if [ "$changed" != "CHANGELOG.md" ]; then
              echo "OpenCode must change only CHANGELOG.md. Changed files:" >&2
              printf '%s\n' "$changed" >&2
              exit 1
            fi
            untracked="$(git ls-files --others --exclude-standard)"
            if [ -n "$untracked" ]; then
              echo "OpenCode left unexpected files:" >&2
              printf '%s\n' "$untracked" >&2
              exit 1
            fi
            ignored="$(git ls-files --others --ignored --exclude-standard)"
            if [ -n "$ignored" ]; then
              echo "OpenCode left unexpected ignored files:" >&2
              printf '%s\n' "$ignored" >&2
              exit 1
            fi
          fi
          mkdir -p release-artifacts
          if [ "$ALREADY_PREPARED" = "false" ]; then
            original_changelog="$(mktemp)"
            git show HEAD:CHANGELOG.md > "$original_changelog"
            node .github/scripts/atlas-core-release.mjs \
              validate-changelog "$VERSION" "$RELEASE_DATE" release-artifacts/release-notes.md "$original_changelog"
            rm -f "$original_changelog"
          else
            node .github/scripts/atlas-core-release.mjs \
              validate-changelog "$VERSION" "$RELEASE_DATE" release-artifacts/release-notes.md
          fi

      - name: Upload isolated changelog
        if: steps.phase.outputs.mode == 'prepare'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-core-changelog-${{ inputs.version }}
          path: |
            CHANGELOG.md
            release-artifacts/release-notes.md
          if-no-files-found: error
          retention-days: 7

  prepare:
    name: Prepare and verify release
    needs: changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download isolated changelog
        if: needs.changelog.outputs.mode == 'prepare'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-core-changelog-${{ inputs.version }}
          path: reviewed-changelog

      - name: Accept only the reviewed changelog artifact
        if: needs.changelog.outputs.mode == 'prepare'
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ needs.changelog.outputs.release_date }}
        run: |
          expected="$(printf '%s\n' CHANGELOG.md release-artifacts/release-notes.md | sort)"
          actual="$(find reviewed-changelog -type f -print | sed 's#^reviewed-changelog/##' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "The isolated changelog job returned unexpected files:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          cp reviewed-changelog/CHANGELOG.md CHANGELOG.md
          mkdir -p release-artifacts
          cp reviewed-changelog/release-artifacts/release-notes.md release-artifacts/release-notes.md
          if git diff --quiet -- CHANGELOG.md; then
            node .github/scripts/atlas-core-release.mjs \
              validate-changelog "$VERSION" "$RELEASE_DATE" release-artifacts/release-notes.md
          else
            original_changelog="$(mktemp)"
            git show HEAD:CHANGELOG.md > "$original_changelog"
            node .github/scripts/atlas-core-release.mjs \
              validate-changelog "$VERSION" "$RELEASE_DATE" release-artifacts/release-notes.md "$original_changelog"
            rm -f "$original_changelog"
          fi
          rm -rf reviewed-changelog

      - name: Prepare committed release notes
        if: needs.changelog.outputs.mode == 'publish'
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ needs.changelog.outputs.release_date }}
        run: |
          mkdir -p release-artifacts
          node .github/scripts/atlas-core-release.mjs \
            validate-changelog "$VERSION" "$RELEASE_DATE" release-artifacts/release-notes.md

      - name: Set up Go
        if: needs.changelog.outputs.mode == 'prepare'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_SUM_FILE }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install exact npm and Atlas Core dependencies
        run: |
          npm install --global --ignore-scripts "npm@$NPM_VERSION"
          npm --version | grep -Fx "$NPM_VERSION"
          npm ci --workspace atlas-core --ignore-scripts

      - name: Version the npm CLI
        if: needs.changelog.outputs.mode == 'prepare'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node .github/scripts/atlas-core-release.mjs prepare-package "$VERSION"
          npm version "$VERSION" --workspace atlas-core --no-git-tag-version --allow-same-version

      - name: Check versioned release inputs
        if: needs.changelog.outputs.mode == 'prepare'
        run: |
          npm audit --audit-level=high
          npm run check --workspace atlas-core
          node --test .github/scripts/atlas-core-release.test.mjs
          (cd packages/protocol && go run ./tools/check && go test ./...)
          (cd services/core && go test ./...)

      - name: Check immutable package inputs
        if: needs.changelog.outputs.mode == 'publish'
        run: |
          npm run check --workspace atlas-core
          git diff --exit-code

      - name: Pack the npm CLI
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm pack --workspace atlas-core \
            --pack-destination release-artifacts \
            --json \
            --silent > release-artifacts/npm-pack.json
          test -f "release-artifacts/atlas-core-$VERSION.tgz"
          (
            cd release-artifacts
            sha256sum "atlas-core-$VERSION.tgz" > SHA256SUMS
          )

      - name: Validate release diff
        if: needs.changelog.outputs.mode == 'prepare'
        run: |
          while IFS= read -r path; do
            case "$path" in
              CHANGELOG.md|package-lock.json|surfaces/core-cli/package.json|surfaces/core-cli/src/package-metadata.ts)
                ;;
              *)
                echo "Unexpected release change: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only)
          git diff --check
          git diff -- \
            CHANGELOG.md \
            package-lock.json \
            surfaces/core-cli/package.json \
            surfaces/core-cli/src/package-metadata.ts | tee release-artifacts/release.diff

      - name: Upload reviewed release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-core-${{ inputs.version }}
          path: |
            CHANGELOG.md
            package-lock.json
            surfaces/core-cli/package.json
            surfaces/core-cli/src/package-metadata.ts
            release-artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish approved release
    needs: [changelog, prepare]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download reviewed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-core-${{ inputs.version }}
          path: .

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install exact npm
        run: |
          npm install --global --ignore-scripts "npm@$NPM_VERSION"
          npm --version | grep -Fx "$NPM_VERSION"

      - name: Install Atlas Core dependencies
        if: needs.changelog.outputs.mode == 'prepare'
        run: |
          npm ci --workspace atlas-core --ignore-scripts

      - name: Verify reviewed package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          (
            cd release-artifacts
            sha256sum --check SHA256SUMS
          )
          package_version="$(node -p "require('./surfaces/core-cli/package.json').version")"
          if [ "$package_version" != "$VERSION" ]; then
            echo "Prepared package version $package_version does not match $VERSION." >&2
            exit 1
          fi

      - name: Revalidate release phase
        env:
          RECOVER_EXISTING_RELEASE: ${{ inputs.recover_existing_release }}
          VERSION: ${{ inputs.version }}
        run: |
          git fetch origin main --tags
          bash .github/scripts/select-atlas-core-release-phase.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: needs.changelog.outputs.mode == 'prepare'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Publish candidate Atlas Core image
        id: built_image
        if: needs.changelog.outputs.mode == 'prepare'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: services/core/docker/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/the-drunken-coder/atlas-core:candidate-${{ inputs.version }}-${{ github.sha }}
          cache-from: type=gha,scope=atlas-core-release
          cache-to: type=gha,mode=max,scope=atlas-core-release
          no-cache-filters: production
          labels: |
            org.opencontainers.image.source=https://github.com/the-Drunken-coder/Atlas-Modernization
            org.opencontainers.image.revision=${{ needs.changelog.outputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Select immutable Atlas Core image
        id: image
        env:
          BUILT_DIGEST: ${{ steps.built_image.outputs.digest }}
          MODE: ${{ needs.changelog.outputs.mode }}
        run: |
          if [ "$MODE" = "prepare" ]; then
            digest="$BUILT_DIGEST"
            reference="ghcr.io/the-drunken-coder/atlas-core@$digest"
          else
            reference="$(node -p "require('./surfaces/core-cli/package.json').atlasCoreImage || ''")"
            digest="${reference##*@}"
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || \
             [ "$reference" != "ghcr.io/the-drunken-coder/atlas-core@$digest" ]; then
            echo "Atlas Core did not produce a valid immutable image reference: $reference" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

      - name: Verify immutable Atlas Core image
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          SOURCE_SHA: ${{ needs.changelog.outputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          for platform in linux/amd64 linux/arm64; do
            config="$(
              docker buildx imagetools inspect "$IMAGE_REFERENCE" \
                --format "{{json (index .Image \"$platform\")}}"
            )"
            revision="$(jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' <<< "$config")"
            version="$(jq -r '.config.Labels["org.opencontainers.image.version"] // empty' <<< "$config")"
            if [ "$revision" != "$SOURCE_SHA" ] || [ "$version" != "$VERSION" ]; then
              echo "$IMAGE_REFERENCE has unexpected release labels for $platform." >&2
              exit 1
            fi
          done
          actual_digest="$(
            docker buildx imagetools inspect "$IMAGE_REFERENCE" --format '{{json .Manifest}}' |
              jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'
          )"
          if [ "$actual_digest" != "${IMAGE_REFERENCE##*@}" ]; then
            echo "$IMAGE_REFERENCE resolved to unexpected digest $actual_digest." >&2
            exit 1
          fi

      - name: Record immutable image in the npm package
        if: needs.changelog.outputs.mode == 'prepare'
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          node - <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const path = "surfaces/core-cli/package.json";
          const packageJSON = JSON.parse(readFileSync(path, "utf8"));
          if (packageJSON.atlasCoreImage !== null) {
            throw new Error(`New release artifact already pins ${packageJSON.atlasCoreImage}`);
          }
          packageJSON.atlasCoreImage = process.env.IMAGE_REFERENCE;
          writeFileSync(path, `${JSON.stringify(packageJSON, null, 2)}\n`);
          NODE
          npm run check --workspace atlas-core
          git diff --check

      - name: Test packed CLI on disposable Docker host
        if: needs.changelog.outputs.mode == 'prepare'
        env:
          ATLAS_CORE_ACCEPTANCE_DISPOSABLE: "1"
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          VERSION: ${{ inputs.version }}
        run: |
          package_root="$(mktemp -d)"
          npm pack --workspace atlas-core \
            --pack-destination "$package_root" \
            --json \
            --silent > "$package_root/npm-pack.json"
          package="$package_root/atlas-core-$VERSION.tgz"
          test -f "$package"
          bash .github/scripts/test-atlas-core-package.sh "$package" "$VERSION" "$IMAGE_REFERENCE"

      - name: Commit and atomically tag release
        id: commit
        if: needs.changelog.outputs.mode == 'prepare'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          while IFS= read -r path; do
            case "$path" in
              CHANGELOG.md|package-lock.json|surfaces/core-cli/package.json|surfaces/core-cli/src/package-metadata.ts)
                ;;
              *)
                echo "Unexpected release change: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            CHANGELOG.md \
            package-lock.json \
            surfaces/core-cli/package.json \
            surfaces/core-cli/src/package-metadata.ts
          git commit -m "chore(release): atlas-core v$VERSION"
          release_sha="$(git rev-parse HEAD)"
          tag="atlas-core-v$VERSION"
          git tag --annotate "$tag" --message "Atlas Core $VERSION" "$release_sha"
          gh auth setup-git
          git push --atomic origin HEAD:main "refs/tags/$tag:refs/tags/$tag"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch immutable tag publication
        if: needs.changelog.outputs.mode == 'prepare'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="atlas-core-v$VERSION"
          gh workflow run release-atlas-core.yml \
            --ref "$tag" \
            --field version="$VERSION"
          echo "Queued Atlas Core $VERSION publication from $tag."

      - name: Promote the reviewed digest to the version tag
        if: needs.changelog.outputs.mode == 'publish'
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          PINNED_DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          final_image="ghcr.io/the-drunken-coder/atlas-core:$VERSION"
          inspect_error="$(mktemp)"
          if final_digest="$(
            docker buildx imagetools inspect "$final_image" --format '{{json .Manifest}}' 2>"$inspect_error" |
              jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'
          )"; then
            if [ "$final_digest" != "$PINNED_DIGEST" ]; then
              echo "$final_image already identifies $final_digest, not $PINNED_DIGEST." >&2
              exit 1
            fi
          elif grep -Eiq 'manifest unknown|name unknown|not found' "$inspect_error"; then
            docker buildx imagetools create --tag "$final_image" "$IMAGE_REFERENCE"
          else
            cat "$inspect_error" >&2
            exit 1
          fi
          promoted_digest="$(
            docker buildx imagetools inspect "$final_image" --format '{{json .Manifest}}' |
              jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'
          )"
          if [ "$promoted_digest" != "$PINNED_DIGEST" ]; then
            echo "$final_image resolved to $promoted_digest after promotion." >&2
            exit 1
          fi

      - name: Verify the exact image digest is publicly pullable
        if: needs.changelog.outputs.mode == 'publish'
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          if ! docker manifest inspect "$IMAGE_REFERENCE" >/dev/null; then
            echo "$IMAGE_REFERENCE is not anonymously pullable." >&2
            echo "Make the GHCR package public, then rerun this failed job before publishing npm." >&2
            exit 1
          fi

      - name: Inspect npm publication state
        id: npm
        if: needs.changelog.outputs.mode == 'publish'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          package="release-artifacts/atlas-core-$VERSION.tgz"
          local_integrity="sha512-$(openssl dgst -sha512 -binary "$package" | openssl base64 -A)"
          version_error="$(mktemp)"
          if published_integrity="$(npm view "atlas-core@$VERSION" dist.integrity 2>"$version_error")"; then
            if [ "$published_integrity" != "$local_integrity" ]; then
              echo "atlas-core@$VERSION is already published with different contents." >&2
              exit 1
            fi
            echo "package_exists=true" >> "$GITHUB_OUTPUT"
            echo "version_exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'E404' "$version_error"; then
            package_error="$(mktemp)"
            if npm view atlas-core name >/dev/null 2>"$package_error"; then
              echo "package_exists=true" >> "$GITHUB_OUTPUT"
            elif grep -q 'E404' "$package_error"; then
              echo "package_exists=false" >> "$GITHUB_OUTPUT"
            else
              cat "$package_error" >&2
              exit 1
            fi
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$version_error" >&2
            exit 1
          fi
          echo "integrity=$local_integrity" >> "$GITHUB_OUTPUT"

      - name: Require an existing npm version for main recovery
        if: needs.changelog.outputs.recovery == 'true' && steps.npm.outputs.version_exists != 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Main recovery cannot publish atlas-core@$VERSION with immutable-tag provenance." >&2
          echo "Dispatch the workflow from atlas-core-v$VERSION to publish an absent npm version." >&2
          exit 1

      - name: Create or verify draft GitHub Release
        if: needs.changelog.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="atlas-core-v$VERSION"
          package="release-artifacts/atlas-core-$VERSION.tgz"
          release_exists=false
          release_is_draft=true
          view_error="$(mktemp)"
          if gh release view "$tag" >/dev/null 2>"$view_error"; then
            release_exists=true
            release_is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [ "$(gh release view "$tag" --json name --jq .name)" != "Atlas Core $VERSION" ]; then
              echo "GitHub Release $tag has an unexpected title." >&2
              exit 1
            fi
            if [ "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" != "false" ]; then
              echo "GitHub Release $tag is unexpectedly marked as a prerelease." >&2
              exit 1
            fi
            if [ "$(gh release view "$tag" --json body --jq .body | sed 's/\r$//')" != \
                 "$(sed 's/\r$//' release-artifacts/release-notes.md)" ]; then
              echo "GitHub Release $tag has notes that do not match the reviewed artifact." >&2
              exit 1
            fi
          elif grep -qi 'release not found' "$view_error"; then
            gh release create "$tag" \
              --draft \
              --verify-tag \
              --title "Atlas Core $VERSION" \
              --notes-file release-artifacts/release-notes.md
          else
            cat "$view_error" >&2
            exit 1
          fi

          if [ "$release_exists" = "false" ] || [ "$release_is_draft" = "true" ]; then
            gh release upload "$tag" \
              "$package#atlas-core-$VERSION.tgz" \
              "release-artifacts/SHA256SUMS#SHA256SUMS" \
              --clobber
          fi

          expected_assets="$(printf '%s\n' SHA256SUMS "atlas-core-$VERSION.tgz" | sort)"
          actual_assets="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
          if [ "$actual_assets" != "$expected_assets" ]; then
            echo "GitHub Release $tag has an unexpected asset set." >&2
            exit 1
          fi
          downloaded="$(mktemp -d)"
          gh release download "$tag" \
            --dir "$downloaded" \
            --pattern "atlas-core-$VERSION.tgz" \
            --pattern SHA256SUMS
          cmp "$package" "$downloaded/atlas-core-$VERSION.tgz"
          cmp release-artifacts/SHA256SUMS "$downloaded/SHA256SUMS"

      - name: Bootstrap the npm package
        if: >-
          needs.changelog.outputs.recovery != 'true' &&
          steps.npm.outputs.version_exists == 'false' &&
          steps.npm.outputs.package_exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "The first atlas-core release requires the short-lived NPM_TOKEN bootstrap secret." >&2
            exit 1
          fi
          npm publish "./release-artifacts/atlas-core-$VERSION.tgz" --access public --provenance

      - name: Publish npm package through trusted publishing
        if: >-
          needs.changelog.outputs.recovery != 'true' &&
          steps.npm.outputs.version_exists == 'false' &&
          steps.npm.outputs.package_exists == 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Trusted publication must not receive a token fallback." >&2
            exit 1
          fi
          npm publish "./release-artifacts/atlas-core-$VERSION.tgz" --access public --provenance

      - name: Verify npm integrity, signatures, and provenance
        if: needs.changelog.outputs.mode == 'publish'
        env:
          EXPECTED_INTEGRITY: ${{ steps.npm.outputs.integrity }}
          RELEASE_SHA: ${{ needs.changelog.outputs.release_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          attestations="$(mktemp)"
          for attempt in $(seq 1 12); do
            published_integrity="$(npm view "atlas-core@$VERSION" dist.integrity 2>/dev/null || true)"
            attestation_url="$(npm view "atlas-core@$VERSION" dist.attestations.url 2>/dev/null || true)"
            if [ "$published_integrity" = "$EXPECTED_INTEGRITY" ] && \
              [ -n "$attestation_url" ] && \
              curl --connect-timeout 5 --max-time 15 --fail --silent --show-error \
                "$attestation_url" > "$attestations"; then
              break
            fi
            if [ "$attempt" = 12 ]; then
              echo "npm did not return the reviewed package and its provenance consistently." >&2
              exit 1
            fi
            sleep 5
          done
          node .github/scripts/atlas-core-release.mjs validate-npm-attestation \
            "$VERSION" \
            "$EXPECTED_INTEGRITY" \
            "$attestations" \
            "https://github.com/the-Drunken-coder/Atlas-Modernization" \
            ".github/workflows/release-atlas-core.yml" \
            "refs/tags/atlas-core-v$VERSION" \
            "$RELEASE_SHA"
          consumer="$(mktemp -d)"
          (
            cd "$consumer"
            npm init --yes --silent >/dev/null
            npm install --ignore-scripts "atlas-core@$VERSION" >/dev/null
            npm audit signatures
          )

      - name: Publish GitHub Release
        if: needs.changelog.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="atlas-core-v$VERSION"
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$tag" --draft=false --latest
          fi
