name: Release Atlas Core

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without a leading v, for example 0.1.0
        required: true
        type: string

permissions: {}

concurrency:
  group: release-atlas-core
  cancel-in-progress: false

env:
  GO_VERSION_FILE: services/core/go.mod
  GO_SUM_FILE: services/core/go.sum
  NPM_VERSION: 11.6.2
  OPENCODE_VERSION: 1.18.21
  OPENCODE_MODEL: opencode-go/gpt-5.6-luna

jobs:
  prepare:
    name: Prepare and review release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_date: ${{ steps.release.outputs.release_date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_SUM_FILE }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Validate release request
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node .github/scripts/atlas-core-release.mjs validate-version "$VERSION"
          current_version="$(node -p "require('./surfaces/core-cli/package.json').version")"
          node .github/scripts/atlas-core-release.mjs validate-next-version "$current_version" "$VERSION"
          latest_tag="$(git tag --list 'atlas-core-v*' --sort=-version:refname | head -n 1)"
          if [ -n "$latest_tag" ]; then
            node .github/scripts/atlas-core-release.mjs \
              validate-next-version "${latest_tag#atlas-core-v}" "$VERSION"
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Atlas Core releases must be dispatched from main." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "The checked-out commit does not match the dispatched commit." >&2
            exit 1
          fi

      - name: Select changelog date
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          existing_date="$(node .github/scripts/atlas-core-release.mjs existing-date "$VERSION")"
          if [ -n "$existing_date" ]; then
            echo "already_prepared=true" >> "$GITHUB_OUTPUT"
            echo "release_date=$existing_date" >> "$GITHUB_OUTPUT"
          else
            echo "already_prepared=false" >> "$GITHUB_OUTPUT"
            echo "release_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build factual changelog context
        if: steps.release.outputs.already_prepared == 'false'
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ steps.release.outputs.release_date }}
        run: |
          previous_tag="$(git tag --list 'atlas-core-v*' --sort=-version:refname | head -n 1)"
          {
            echo "# Atlas Core release context"
            echo
            echo "Version: $VERSION"
            echo "Release date: $RELEASE_DATE"
            echo "Previous Atlas Core tag: ${previous_tag:-none}"
            echo
            echo "## Relevant commits"
            if [ -n "$previous_tag" ]; then
              git log --format='- %h %s' "$previous_tag..HEAD" -- \
                surfaces/core-cli services/core packages/protocol .github/workflows/release-atlas-core.yml
            else
              git log --max-count=100 --format='- %h %s' -- \
                surfaces/core-cli services/core packages/protocol .github/workflows/release-atlas-core.yml
            fi
            echo
            echo "## Relevant changed files"
            if [ -n "$previous_tag" ]; then
              git diff --name-status "$previous_tag..HEAD" -- \
                surfaces/core-cli services/core packages/protocol .github/workflows/release-atlas-core.yml
            else
              git ls-files surfaces/core-cli services/core packages/protocol .github/workflows/release-atlas-core.yml
            fi
          } > .atlas-core-release-context.md

      - name: Write changelog with OpenCode Go
        if: steps.release.outputs.already_prepared == 'false'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_DISABLE_AUTOUPDATE: "true"
          OPENCODE_DISABLE_DEFAULT_PLUGINS: "true"
          OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
          OPENCODE_PERMISSION: '{"bash":"deny","task":"deny","webfetch":"deny","websearch":"deny","question":"deny","edit":"allow","read":"allow","glob":"allow","grep":"allow","list":"allow","external_directory":"deny"}'
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ steps.release.outputs.release_date }}
        run: |
          prompt="$(cat <<EOF
          Edit CHANGELOG.md and no other file.

          Prepend a release section whose exact heading is:
          ## $VERSION - $RELEASE_DATE

          Read .atlas-core-release-context.md and the relevant repository files. Write concise operator-facing
          release notes using only facts you can verify. Use Markdown bullets. Add Added, Changed, Fixed, or Security
          subheadings only when they help. Mention commands, installation, storage safety, compatibility, and release
          behavior when they changed. Do not invent claims, use placeholders, discuss internal test work, or rewrite
          older release sections. Do not run commands. Stop after editing CHANGELOG.md.
          EOF
          )"
          npx --yes "opencode-ai@$OPENCODE_VERSION" run \
            --pure \
            --model "$OPENCODE_MODEL" \
            --title "Atlas Core $VERSION changelog" \
            "$prompt"

      - name: Validate OpenCode changelog
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ steps.release.outputs.release_date }}
          ALREADY_PREPARED: ${{ steps.release.outputs.already_prepared }}
        run: |
          rm -f .atlas-core-release-context.md
          if [ "$ALREADY_PREPARED" = "false" ]; then
            changed="$(git diff --name-only)"
            if [ "$changed" != "CHANGELOG.md" ]; then
              echo "OpenCode must change only CHANGELOG.md. Changed files:" >&2
              printf '%s\n' "$changed" >&2
              exit 1
            fi
            untracked="$(git ls-files --others --exclude-standard)"
            if [ -n "$untracked" ]; then
              echo "OpenCode left unexpected files:" >&2
              printf '%s\n' "$untracked" >&2
              exit 1
            fi
            ignored="$(git ls-files --others --ignored --exclude-standard)"
            if [ -n "$ignored" ]; then
              echo "OpenCode left unexpected ignored files:" >&2
              printf '%s\n' "$ignored" >&2
              exit 1
            fi
          fi
          mkdir -p release-artifacts
          if [ "$ALREADY_PREPARED" = "false" ]; then
            original_changelog="$(mktemp)"
            git show HEAD:CHANGELOG.md > "$original_changelog"
            node .github/scripts/atlas-core-release.mjs \
              validate-changelog "$VERSION" "$RELEASE_DATE" release-artifacts/release-notes.md "$original_changelog"
            rm -f "$original_changelog"
          else
            node .github/scripts/atlas-core-release.mjs \
              validate-changelog "$VERSION" "$RELEASE_DATE" release-artifacts/release-notes.md
          fi

      - name: Install JavaScript workspace dependencies
        run: npm ci

      - name: Check release inputs
        run: |
          npm audit --audit-level=high
          npm run check --workspace atlas-core
          (cd packages/protocol && go run ./tools/check && go test ./...)
          (cd services/core && go test ./...)

      - name: Version and pack the npm CLI
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm version "$VERSION" --workspace atlas-core --no-git-tag-version --allow-same-version
          npm run build --workspace atlas-core
          npm pack --workspace atlas-core \
            --pack-destination release-artifacts \
            --json \
            --silent > release-artifacts/npm-pack.json
          test -f "release-artifacts/atlas-core-$VERSION.tgz"
          (
            cd release-artifacts
            sha256sum "atlas-core-$VERSION.tgz" > SHA256SUMS
          )

      - name: Validate release diff
        run: |
          while IFS= read -r path; do
            case "$path" in
              CHANGELOG.md|package-lock.json|surfaces/core-cli/package.json|surfaces/core-cli/src/package-metadata.ts)
                ;;
              *)
                echo "Unexpected release change: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only)
          git diff --check
          git diff -- \
            CHANGELOG.md \
            package-lock.json \
            surfaces/core-cli/package.json \
            surfaces/core-cli/src/package-metadata.ts | tee release-artifacts/release.diff

      - name: Upload reviewed release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-core-${{ inputs.version }}
          path: |
            CHANGELOG.md
            package-lock.json
            surfaces/core-cli/package.json
            surfaces/core-cli/src/package-metadata.ts
            release-artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish approved release
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download reviewed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-core-${{ inputs.version }}
          path: .

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: |
          npm install --global --ignore-scripts "npm@$NPM_VERSION"
          npm --version | grep -Fx "$NPM_VERSION"

      - name: Verify reviewed release
        id: package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          (
            cd release-artifacts
            sha256sum --check SHA256SUMS
          )
          package_version="$(node -p "require('./surfaces/core-cli/package.json').version")"
          if [ "$package_version" != "$VERSION" ]; then
            echo "Prepared package version $package_version does not match $VERSION." >&2
            exit 1
          fi
          package="release-artifacts/atlas-core-$VERSION.tgz"
          npm_view_error="$(mktemp)"
          if published_integrity="$(npm view "atlas-core@$VERSION" dist.integrity 2>"$npm_view_error")"; then
            local_integrity="sha512-$(openssl dgst -sha512 -binary "$package" | openssl base64 -A)"
            if [ "$published_integrity" != "$local_integrity" ]; then
              echo "atlas-core@$VERSION is already published with different contents." >&2
              exit 1
            fi
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'E404' "$npm_view_error"; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            cat "$npm_view_error" >&2
            exit 1
          fi

      - name: Refuse a stale main branch
        id: main
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git fetch origin main --tags
          main_sha="$(git rev-parse origin/main)"
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            echo "release_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git rev-parse "$main_sha^")" != "$GITHUB_SHA" ]; then
            echo "main moved beyond this release's generated commit. Dispatch a new release run." >&2
            exit 1
          fi
          if [ "$(git show -s --format=%s "$main_sha")" != "chore(release): atlas-core v$VERSION" ]; then
            echo "main moved to an unexpected commit after this release was dispatched." >&2
            exit 1
          fi
          while IFS= read -r path; do
            case "$path" in
              CHANGELOG.md|package-lock.json|surfaces/core-cli/package.json|surfaces/core-cli/src/package-metadata.ts)
                ;;
              *)
                echo "The existing release commit changed an unexpected file: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$GITHUB_SHA..$main_sha")
          for path in \
            CHANGELOG.md \
            package-lock.json \
            surfaces/core-cli/package.json \
            surfaces/core-cli/src/package-metadata.ts; do
            if ! git diff --quiet "$main_sha" -- "$path"; then
              echo "The existing release commit does not match the reviewed $path artifact." >&2
              exit 1
            fi
          done
          echo "release_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Commit release files
        id: commit
        env:
          EXISTING_RELEASE_SHA: ${{ steps.main.outputs.release_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          while IFS= read -r path; do
            case "$path" in
              CHANGELOG.md|package-lock.json|surfaces/core-cli/package.json|surfaces/core-cli/src/package-metadata.ts)
                ;;
              *)
                echo "Unexpected release change: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only)
          if [ -n "$EXISTING_RELEASE_SHA" ]; then
            echo "release_sha=$EXISTING_RELEASE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="atlas-core-v$VERSION"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            if ! git diff --quiet; then
              echo "$tag already exists, but this run still needs a release commit." >&2
              exit 1
            fi
            if [ "$(git rev-list -n 1 "$tag")" != "$(git rev-parse HEAD)" ]; then
              echo "$tag already points to another commit." >&2
              exit 1
            fi
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            CHANGELOG.md \
            package-lock.json \
            surfaces/core-cli/package.json \
            surfaces/core-cli/src/package-metadata.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): atlas-core v$VERSION"
            gh auth setup-git
            git push origin HEAD:main
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require a run from the release commit
        env:
          RELEASE_SHA: ${{ steps.commit.outputs.release_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "Release commit $RELEASE_SHA was pushed to main." >&2
            echo "Dispatch Release Atlas Core for $VERSION again from the new main head before publishing." >&2
            echo "The second run is required so npm provenance identifies the release commit." >&2
            exit 1
          fi

      - name: Tag release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.commit.outputs.release_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="atlas-core-v$VERSION"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            if [ "$(git rev-list -n 1 "$tag")" != "$RELEASE_SHA" ]; then
              echo "$tag already points to another commit." >&2
              exit 1
            fi
          else
            git tag --annotate "$tag" --message "Atlas Core $VERSION" "$RELEASE_SHA"
            gh auth setup-git
            git push origin "$tag"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for the published Atlas Core image
        id: image
        env:
          RELEASE_SHA: ${{ steps.commit.outputs.release_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/the-drunken-coder/atlas-core:$VERSION"
          if ! docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for platform in linux/amd64 linux/arm64; do
            if ! config="$(
              docker buildx imagetools inspect "$image" \
                --format "{{json (index .Image \"$platform\")}}" 2>/dev/null
            )"; then
              echo "$image does not contain the expected $platform image." >&2
              exit 1
            fi
            revision="$(jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' <<< "$config")"
            version="$(jq -r '.config.Labels["org.opencontainers.image.version"] // empty' <<< "$config")"
            if [ "$revision" != "$RELEASE_SHA" ] || [ "$version" != "$VERSION" ]; then
              echo "$image has unexpected release labels for $platform." >&2
              exit 1
            fi
          done
          echo "already_published=true" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.image.outputs.already_published != 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Publish Atlas Core image
        if: steps.image.outputs.already_published != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: services/core/docker/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/the-drunken-coder/atlas-core:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/the-Drunken-coder/Atlas-Modernization
            org.opencontainers.image.revision=${{ steps.commit.outputs.release_sha }}
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Verify the image is publicly pullable
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          if ! docker manifest inspect "ghcr.io/the-drunken-coder/atlas-core:$VERSION" >/dev/null; then
            echo "The Atlas Core image is not anonymously pullable." >&2
            echo "Make the GHCR package public, then rerun this failed job before publishing npm." >&2
            exit 1
          fi

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="atlas-core-v$VERSION"
          package="release-artifacts/atlas-core-$VERSION.tgz"
          release_exists=false
          release_is_draft=true
          if gh release view "$tag" >/dev/null 2>&1; then
            release_exists=true
            release_is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [ "$(gh release view "$tag" --json name --jq .name)" != "Atlas Core $VERSION" ]; then
              echo "GitHub Release $tag has an unexpected title." >&2
              exit 1
            fi
            if [ "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" != "false" ]; then
              echo "GitHub Release $tag is unexpectedly marked as a prerelease." >&2
              exit 1
            fi
            if [ "$(gh release view "$tag" --json body --jq .body | sed 's/\r$//')" != "$(sed 's/\r$//' release-artifacts/release-notes.md)" ]; then
              echo "GitHub Release $tag has notes that do not match the reviewed artifact." >&2
              exit 1
            fi
          else
            gh release create "$tag" \
              --draft \
              --verify-tag \
              --title "Atlas Core $VERSION" \
              --notes-file release-artifacts/release-notes.md
          fi

          if [ "$release_exists" = "false" ] || [ "$release_is_draft" = "true" ]; then
            gh release upload "$tag" \
              "$package#atlas-core-$VERSION.tgz" \
              "release-artifacts/SHA256SUMS#SHA256SUMS" \
              --clobber
          fi

          expected_assets="$(printf '%s\n' SHA256SUMS "atlas-core-$VERSION.tgz" | sort)"
          actual_assets="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
          if [ "$actual_assets" != "$expected_assets" ]; then
            echo "GitHub Release $tag has an unexpected asset set." >&2
            exit 1
          fi
          downloaded="$(mktemp -d)"
          gh release download "$tag" \
            --dir "$downloaded" \
            --pattern "atlas-core-$VERSION.tgz" \
            --pattern SHA256SUMS
          cmp "$package" "$downloaded/atlas-core-$VERSION.tgz"
          cmp release-artifacts/SHA256SUMS "$downloaded/SHA256SUMS"

          if [ "$release_is_draft" = "true" ]; then
            gh release edit "$tag" --draft=false --latest
          fi

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          package="release-artifacts/atlas-core-$VERSION.tgz"
          npm_view_error="$(mktemp)"
          if published_integrity="$(npm view "atlas-core@$VERSION" dist.integrity 2>"$npm_view_error")"; then
            local_integrity="sha512-$(openssl dgst -sha512 -binary "$package" | openssl base64 -A)"
            if [ "$published_integrity" != "$local_integrity" ]; then
              echo "atlas-core@$VERSION is already published with different contents." >&2
              exit 1
            fi
            echo "atlas-core@$VERSION is already published with the reviewed contents."
          elif grep -q 'E404' "$npm_view_error"; then
            npm publish "$package" --access public --provenance
          else
            cat "$npm_view_error" >&2
            exit 1
          fi
