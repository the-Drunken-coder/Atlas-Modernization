name: Release Atlas Core

run-name: Release Atlas Core from ${{ github.ref_name }}

on:
  push:
    tags:
      - atlas-core-v*
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-atlas-core-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NPM_VERSION: 11.6.2
  OPENCODE_VERSION: 1.18.21
  OPENCODE_MODEL: opencode-go/gpt-5.6-luna
  IMAGE_REPOSITORY: ghcr.io/the-drunken-coder/atlas-core

jobs:
  inspect:
    name: Validate tag and inspect release state
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    outputs:
      mode: ${{ steps.state.outputs.mode }}
      version: ${{ steps.identity.outputs.version }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      tag: ${{ steps.identity.outputs.tag }}
      tag_object: ${{ steps.identity.outputs.tag_object }}
      handoff_digest: sha256:${{ steps.sealed-artifact.outputs.artifact-digest }}
    steps:
      - name: Require an immutable tag dispatch
        if: github.ref_type != 'tag'
        run: |
          echo "Run recovery from the existing atlas-core-v<version> tag, never from a branch." >&2
          exit 1

      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install and build release tools
        run: |
          npm ci --workspace @atlas/atlas-core-release --ignore-scripts
          npm run build --workspace @atlas/atlas-core-release

      - name: Validate immutable source identity
        id: identity
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node tools/atlas-core-release/dist/cli.js version-from-tag --tag "$TAG")"
          git fetch origin main:refs/remotes/origin/main --tags --force
          source_sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          tag_object="$(node tools/atlas-core-release/dist/cli.js validate-release-tag \
            --version "$version" \
            --source-sha "$source_sha")"
          git merge-base --is-ancestor "$source_sha" origin/main
          {
            echo "version=$version"
            echo "source_sha=$source_sha"
            echo "tag=$TAG"
            echo "tag_object=$tag_object"
          } >> "$GITHUB_OUTPUT"

      - name: Revalidate exact required Core CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          node tools/atlas-core-release/dist/cli.js verify-ci \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --timeout-seconds 0 \
            > "$RUNNER_TEMP/required-core-ci.json"

      - name: Inspect permanent release bundle
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p sealed-bundle
          if release_json="$(timeout 2m gh release view "$TAG" --json isDraft,isPrerelease,name,body,assets 2>"$RUNNER_TEMP/release-error")"; then
            if jq -e '.assets[] | select(.name == "release-manifest.json")' <<< "$release_json" >/dev/null; then
              if [ "$(jq -r .isDraft <<< "$release_json")" = "true" ]; then
                mode=prepare
              else
                release_api="$(timeout 2m gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
                if [ "$(jq -r .immutable <<< "$release_api")" != "true" ]; then
                  echo "Published release $TAG is mutable and cannot be trusted as a sealed candidate." >&2
                  exit 1
                fi
                timeout 5m gh release download "$TAG" --dir sealed-bundle
                if [ "$(jq -r .isPrerelease <<< "$release_json")" = "true" ]; then
                  mode=sealed
                else
                  node tools/atlas-core-release/dist/cli.js inspect-publication \
                    --manifest sealed-bundle/release-manifest.json \
                    --root sealed-bundle \
                    > "$RUNNER_TEMP/publication-plan.json"
                  if [ "$(jq -r .complete "$RUNNER_TEMP/publication-plan.json")" = "true" ]; then
                    mode=complete
                  else
                    mode=sealed
                  fi
                fi
              fi
            elif [ "$(jq -r .isDraft <<< "$release_json")" = "true" ]; then
              mode=prepare
            else
              echo "Published release $TAG has no sealed manifest." >&2
              exit 1
            fi
          elif grep -qi 'release not found' "$RUNNER_TEMP/release-error"; then
            mode=prepare
          else
            cat "$RUNNER_TEMP/release-error" >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Verify downloaded sealed bundle
        if: steps.state.outputs.mode == 'sealed' || steps.state.outputs.mode == 'complete'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node tools/atlas-core-release/dist/cli.js verify-bundle \
            --manifest sealed-bundle/release-manifest.json \
            --root sealed-bundle
          (cd sealed-bundle && sha256sum --check SHA256SUMS)
          release_json="$(timeout 2m gh release view "${{ steps.identity.outputs.tag }}" --json isPrerelease,name,body)"
          test "$(jq -r .name <<< "$release_json")" = "Atlas Core ${{ steps.identity.outputs.version }}"
          if [ "${{ steps.state.outputs.mode }}" = complete ]; then
            test "$(jq -r .isPrerelease <<< "$release_json")" = false
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/${{ steps.identity.outputs.tag }}" --jq .immutable)" = true
          gh release verify "${{ steps.identity.outputs.tag }}"
          for path in sealed-bundle/*; do gh release verify-asset "${{ steps.identity.outputs.tag }}" "$path"; done
          test "$(jq -r .body <<< "$release_json" | sed 's/\r$//')" = \
            "$(sed 's/\r$//' sealed-bundle/release-notes.md)"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source "${{ steps.identity.outputs.source_sha }}" \
            --arg tag "${{ steps.identity.outputs.tag }}" \
            --arg tag_object "${{ steps.identity.outputs.tag_object }}" \
            '.release.repository == $repository and .release.source_sha == $source and
             .release.tag_name == $tag and .release.tag_object == $tag_object' \
            sealed-bundle/release-manifest.json >/dev/null

      - name: Upload sealed recovery bundle
        id: sealed-artifact
        if: steps.state.outputs.mode == 'sealed'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-core-sealed-${{ steps.identity.outputs.version }}-${{ github.run_id }}
          path: sealed-bundle/
          if-no-files-found: error
          retention-days: 90

  notes:
    name: Generate fixed release notes
    if: needs.inspect.outputs.mode == 'prepare'
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install and build release tools
        run: |
          npm ci --workspace @atlas/atlas-core-release --ignore-scripts
          npm run build --workspace @atlas/atlas-core-release

      - name: Build factual release context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.inspect.outputs.version }}
        run: |
          set -euo pipefail
          releases="$RUNNER_TEMP/atlas-core-releases.json"
          timeout 2m gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName > "$releases"
          previous_tag="$(node tools/atlas-core-release/dist/cli.js previous-release-tag \
            --version "$VERSION" --releases "$releases")"
          {
            echo "# Atlas Core release context"
            echo
            echo "Version: $VERSION"
            echo "Source: ${{ needs.inspect.outputs.source_sha }}"
            echo "Previous Atlas Core tag: ${previous_tag:-none}"
            echo
            echo "## Previous published release notes"
            if [ -n "$previous_tag" ]; then
              gh release view "$previous_tag" --json body --jq .body 2>/dev/null || echo "Unavailable."
            else
              echo "None."
            fi
            echo
            echo "## Relevant commits"
            if [ -n "$previous_tag" ]; then
              git log --format='- %h %s' "$previous_tag..HEAD" -- \
                surfaces/core-cli services/core packages/protocol tools/atlas-core-release \
                .github/workflows/release-atlas-core.yml
            else
              git log --max-count=100 --format='- %h %s' -- \
                surfaces/core-cli services/core packages/protocol tools/atlas-core-release \
                .github/workflows/release-atlas-core.yml
            fi
            echo
            echo "## Relevant changed files"
            if [ -n "$previous_tag" ]; then
              git diff --name-status "$previous_tag..HEAD" -- \
                surfaces/core-cli services/core packages/protocol tools/atlas-core-release \
                .github/workflows/release-atlas-core.yml
            fi
          } > .atlas-core-release-context.md

      - name: Generate standalone notes with OpenCode Go
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_DISABLE_AUTOUPDATE: "true"
          OPENCODE_DISABLE_DEFAULT_PLUGINS: "true"
          OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
          OPENCODE_PERMISSION: '{"bash":"deny","task":"deny","webfetch":"deny","websearch":"deny","question":"deny","edit":"allow","read":"allow","glob":"allow","grep":"allow","list":"allow","external_directory":"deny"}'
          VERSION: ${{ needs.inspect.outputs.version }}
        run: |
          prompt="$(cat <<EOF
          Create release-notes.md and edit no tracked file.

          The first line must be exactly:
          # Atlas Core $VERSION

          Read .atlas-core-release-context.md and relevant repository files. Write concise operator-facing release
          notes using only facts you can verify. Use Markdown bullets. Mention commands, installation, storage safety,
          compatibility, and release behavior when they changed. Do not invent claims, use placeholders, discuss
          internal test work, edit CHANGELOG.md, or run commands. Stop after writing release-notes.md.
          EOF
          )"
          npx --yes "opencode-ai@$OPENCODE_VERSION" run \
            --pure \
            --model "$OPENCODE_MODEL" \
            --title "Atlas Core $VERSION release notes" \
            "$prompt"

      - name: Accept only standalone notes
        run: |
          set -euo pipefail
          git diff --exit-code
          actual="$(git ls-files --others --exclude-standard | sort)"
          expected="$(printf '%s\n' .atlas-core-release-context.md release-notes.md | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "OpenCode changed files outside the standalone notes boundary:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          rm .atlas-core-release-context.md
          node tools/atlas-core-release/dist/cli.js validate-notes \
            --path release-notes.md \
            --version "${{ needs.inspect.outputs.version }}"

      - name: Upload fixed notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-core-notes-${{ needs.inspect.outputs.version }}-${{ github.run_id }}
          path: release-notes.md
          if-no-files-found: error
          retention-days: 90

  image:
    name: Build multi-architecture image
    if: needs.inspect.outputs.mode == 'prepare'
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      reference: ${{ steps.identity.outputs.reference }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push candidate digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/core/docker/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:candidate-${{ needs.inspect.outputs.version }}-${{ needs.inspect.outputs.source_sha }}
          cache-from: type=gha,scope=atlas-core-release
          cache-to: type=gha,mode=max,scope=atlas-core-release
          no-cache-filters: production
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.inspect.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.inspect.outputs.version }}

      - name: Verify image identity
        id: identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ needs.inspect.outputs.source_sha }}
          VERSION: ${{ needs.inspect.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          reference="$IMAGE_REPOSITORY@$DIGEST"
          for platform in linux/amd64 linux/arm64; do
            config="$(timeout 2m docker buildx imagetools inspect "$reference" --format "{{json (index .Image \"$platform\")}}")"
            test "$(jq -r '.config.Labels["org.opencontainers.image.revision"]' <<< "$config")" = "$SOURCE_SHA"
            test "$(jq -r '.config.Labels["org.opencontainers.image.version"]' <<< "$config")" = "$VERSION"
          done
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          jq -n --arg digest "$DIGEST" --arg reference "$reference" \
            '{digest: $digest, reference: $reference, platforms: ["linux/amd64", "linux/arm64"]}' > image.json

      - name: Upload image identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-core-image-${{ needs.inspect.outputs.version }}-${{ github.run_id }}
          path: image.json
          if-no-files-found: error
          retention-days: 90

  package:
    name: Build exact npm tarball
    if: needs.inspect.outputs.mode == 'prepare'
    needs: [inspect, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install and build release tools
        run: |
          npm ci --workspace @atlas/atlas-core-release --ignore-scripts
          npm run build --workspace @atlas/atlas-core-release

      - name: Create isolated packaging tree
        env:
          IMAGE_REFERENCE: ${{ needs.image.outputs.reference }}
          SOURCE_SHA: ${{ needs.inspect.outputs.source_sha }}
          VERSION: ${{ needs.inspect.outputs.version }}
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/atlas-core-package-source"
          git worktree add --detach "$package_root" "$SOURCE_SHA"
          node tools/atlas-core-release/dist/cli.js prepare-package \
            --root "$package_root" --version "$VERSION" --image "$IMAGE_REFERENCE"
          (
            cd "$package_root"
            npm ci --ignore-scripts
            npm audit --audit-level=high
            npm run check --workspace atlas-core
            mkdir -p "$RUNNER_TEMP/atlas-core-package"
            npm pack --workspace atlas-core --pack-destination "$RUNNER_TEMP/atlas-core-package" \
              --json --silent > "$RUNNER_TEMP/atlas-core-package/npm-pack.json"
          )
          package="$RUNNER_TEMP/atlas-core-package/atlas-core-$VERSION.tgz"
          test -f "$package"
          PACKAGE="$package" node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          const bytes = readFileSync(process.env.PACKAGE);
          writeFileSync(`${process.env.RUNNER_TEMP}/atlas-core-package/package.json`, `${JSON.stringify({
            filename: process.env.PACKAGE.split("/").at(-1),
            sha256: createHash("sha256").update(bytes).digest("hex"),
            integrity: `sha512-${createHash("sha512").update(bytes).digest("base64")}`
          }, null, 2)}\n`);
          NODE

      - name: Upload exact package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-core-package-${{ needs.inspect.outputs.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/atlas-core-package/
          if-no-files-found: error
          retention-days: 90

  docker-acceptance:
    name: Docker acceptance (${{ matrix.platform }})
    if: needs.inspect.outputs.mode == 'prepare'
    needs: [inspect, image, package]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download exact package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-core-package-${{ needs.inspect.outputs.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/atlas-core-package

      - name: Sign in for candidate pull
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Exercise exact candidate lifecycle
        env:
          ATLAS_CORE_ACCEPTANCE_DISPOSABLE: "1"
          ATLAS_CORE_ACCEPTANCE_EXECUTION_MODE: native
          ATLAS_CORE_ACCEPTANCE_ARTIFACTS: ${{ runner.temp }}/acceptance
          IMAGE_REFERENCE: ${{ needs.image.outputs.reference }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.inspect.outputs.version }}
        run: |
          package="$RUNNER_TEMP/atlas-core-package/atlas-core-$VERSION.tgz"
          bash .github/scripts/test-atlas-core-package.sh "$package" "$VERSION" "$IMAGE_REFERENCE" "$PLATFORM"
          tar -C "$RUNNER_TEMP/acceptance" -czf "$RUNNER_TEMP/docker-${{ matrix.architecture }}.tgz" .

      - name: Upload Docker evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-core-docker-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docker-${{ matrix.architecture }}.tgz
          if-no-files-found: error
          retention-days: 90

  package-acceptance:
    name: Packed consumer (${{ matrix.name }})
    if: needs.inspect.outputs.mode == 'prepare'
    needs: [inspect, package]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: linux-x64
            platform: linux
            architecture: x64
          - runner: ubuntu-24.04-arm
            name: linux-arm64
            platform: linux
            architecture: arm64
          - runner: macos-15-intel
            name: macos-x64
            platform: darwin
            architecture: x64
          - runner: macos-15
            name: macos-arm64
            platform: darwin
            architecture: arm64
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download exact package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-core-package-${{ needs.inspect.outputs.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/atlas-core-package

      - name: Exercise exact packed consumer
        env:
          ATLAS_CORE_EXPECTED_PLATFORM: ${{ matrix.platform }}
          ATLAS_CORE_EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          ATLAS_CORE_EXPECTED_EXECUTION: native
          ATLAS_CORE_PACKED_CLI_EVIDENCE: ${{ runner.temp }}/portable-${{ matrix.name }}.json
          ATLAS_CORE_PACKAGE_TARBALL: ${{ runner.temp }}/atlas-core-package/atlas-core-${{ needs.inspect.outputs.version }}.tgz
        run: node surfaces/core-cli/test/portable-packed-cli.mjs

      - name: Upload packed-consumer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-core-portable-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portable-${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 90

  assemble:
    name: Seal candidate identity
    if: needs.inspect.outputs.mode == 'prepare'
    needs: [inspect, notes, image, package, docker-acceptance, package-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_digest: sha256:${{ steps.upload.outputs.artifact-digest }}
      candidate_identity: ${{ steps.manifest.outputs.candidate_identity }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install and build release tools
        run: |
          npm ci --workspace @atlas/atlas-core-release --ignore-scripts
          npm run build --workspace @atlas/atlas-core-release

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-core-package-${{ needs.inspect.outputs.version }}-${{ github.run_id }}
          path: candidate/package

      - name: Download notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-core-notes-${{ needs.inspect.outputs.version }}-${{ github.run_id }}
          path: candidate/notes

      - name: Download Docker evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: atlas-core-docker-*-${{ github.run_id }}-*
          path: candidate/evidence-artifacts

      - name: Download packed-consumer evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: atlas-core-portable-*-${{ github.run_id }}-*
          path: candidate/evidence-artifacts

      - name: Select latest acceptance evidence
        run: |
          set -euo pipefail
          mkdir -p candidate/evidence
          for name in docker-amd64 docker-arm64; do
            directory="$(find candidate/evidence-artifacts -mindepth 1 -maxdepth 1 -type d \
              -name "atlas-core-$name-$GITHUB_RUN_ID-*" -print | sort -V | tail -n 1)"
            test -n "$directory"
            cp "$directory/$name.tgz" "candidate/evidence/$name.tgz"
          done
          for name in portable-linux-x64 portable-linux-arm64 portable-macos-x64 portable-macos-arm64; do
            directory="$(find candidate/evidence-artifacts -mindepth 1 -maxdepth 1 -type d \
              -name "atlas-core-$name-$GITHUB_RUN_ID-*" -print | sort -V | tail -n 1)"
            test -n "$directory"
            cp "$directory/$name.json" "candidate/evidence/$name.json"
          done

      - name: Create and verify manifest
        id: manifest
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          SOURCE_SHA: ${{ needs.inspect.outputs.source_sha }}
          TAG: ${{ needs.inspect.outputs.tag }}
          TAG_OBJECT: ${{ needs.inspect.outputs.tag_object }}
          VERSION: ${{ needs.inspect.outputs.version }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/release-bundle"
          mkdir -p "$bundle"
          cp "candidate/package/atlas-core-$VERSION.tgz" "$bundle/"
          cp candidate/notes/release-notes.md "$bundle/"
          cp candidate/evidence/* "$bundle/"
          evidence_json="$(find "$bundle" -maxdepth 1 -type f \( -name 'docker-*.tgz' -o -name 'portable-*.json' \) -print | sort | jq -Rsc 'split("\n") | map(select(length > 0))')"
          jq -n \
            --arg version "$VERSION" --arg repository "$GITHUB_REPOSITORY" --arg sourceSha "$SOURCE_SHA" \
            --arg tagName "$TAG" --arg tagObject "$TAG_OBJECT" --arg imageRepository "$IMAGE_REPOSITORY" \
            --arg imageDigest "$IMAGE_DIGEST" --arg packagePath "$bundle/atlas-core-$VERSION.tgz" \
            --arg notesPath "$bundle/release-notes.md" --argjson evidencePaths "$evidence_json" \
            --argjson runId "$GITHUB_RUN_ID" --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            '{version: $version, repository: $repository, sourceSha: $sourceSha, tagName: $tagName,
              tagObject: $tagObject, imageRepository: $imageRepository, imageDigest: $imageDigest,
              platforms: ["linux/amd64", "linux/arm64"], packagePath: $packagePath, notesPath: $notesPath,
              evidencePaths: $evidencePaths, runId: $runId, runAttempt: $runAttempt}' \
            > "$RUNNER_TEMP/manifest-spec.json"
          node tools/atlas-core-release/dist/cli.js create-manifest \
            --spec "$RUNNER_TEMP/manifest-spec.json" --output "$bundle/release-manifest.json"
          (cd "$bundle" && sha256sum -- * > SHA256SUMS)
          node tools/atlas-core-release/dist/cli.js verify-bundle \
            --manifest "$bundle/release-manifest.json" --root "$bundle"
          candidate_identity="$(node --input-type=module - "$bundle/release-manifest.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { candidateIdentity } from "./tools/atlas-core-release/dist/release.js";
          process.stdout.write(candidateIdentity(JSON.parse(readFileSync(process.argv[2], "utf8"))));
          NODE
          )"
          echo "candidate_identity=$candidate_identity" >> "$GITHUB_OUTPUT"

      - name: Upload exact candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-core-candidate-${{ needs.inspect.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle/
          if-no-files-found: error
          retention-days: 90

  review:
    name: Present exact publication candidate
    if: >-
      always() && needs.inspect.result == 'success' && needs.inspect.outputs.mode != 'complete' &&
      (needs.inspect.outputs.mode == 'sealed' || needs.assemble.result == 'success')
    needs: [inspect, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Download prepared candidate
        if: needs.inspect.outputs.mode == 'prepare'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-core-candidate-${{ needs.inspect.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate

      - name: Download sealed candidate
        if: needs.inspect.outputs.mode == 'sealed'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-core-sealed-${{ needs.inspect.outputs.version }}-${{ github.run_id }}
          path: candidate

      - name: Write approval summary
        env:
          ARTIFACT_DIGEST: ${{ needs.assemble.outputs.artifact_digest }}
          CANDIDATE_IDENTITY: ${{ needs.assemble.outputs.candidate_identity }}
          MODE: ${{ needs.inspect.outputs.mode }}
          VERSION: ${{ needs.inspect.outputs.version }}
        run: |
          artifacts_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#artifacts"
          image_url="$GITHUB_SERVER_URL/${GITHUB_REPOSITORY_OWNER}?tab=packages&repo_name=${GITHUB_REPOSITORY#*/}"
          # shellcheck disable=SC2016
          {
            printf '## Approve Atlas Core %s candidate\n\n' "$VERSION"
            printf -- '- Mode: `%s`\n' "$MODE"
            printf -- '- Source: `%s`\n' "${{ needs.inspect.outputs.source_sha }}"
            printf -- '- Tag: `%s`\n' "${{ needs.inspect.outputs.tag }}"
            printf -- '- Notes and manifest: [candidate artifact](%s)\n' "$artifacts_url"
            printf -- '- Image: [`%s@%s`](%s)\n' "$(jq -r .image.repository candidate/release-manifest.json)" "$(jq -r .image.digest candidate/release-manifest.json)" "$image_url"
            printf -- '- Package: [`%s`](%s) (`%s`)\n' "$(jq -r .package.filename candidate/release-manifest.json)" "$artifacts_url" "$(jq -r .package.sha256 candidate/release-manifest.json)"
            printf -- '- Candidate identity: `%s`\n' "${CANDIDATE_IDENTITY:-sealed in GitHub Release}"
            printf -- '- Actions artifact digest: `%s`\n' "${ARTIFACT_DIGEST:-recovered from sealed bundle}"
            printf -- '- Acceptance evidence: [%s](%s)\n' "$(jq -r '.acceptance | keys | join(", ")' candidate/release-manifest.json)" "$artifacts_url"
            printf '%s\n' '- Approval publishes or reconciles only this exact candidate.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Approve and reconcile publication
    if: >-
      always() && needs.inspect.result == 'success' && needs.review.result == 'success' &&
      needs.inspect.outputs.mode != 'complete' &&
      (needs.inspect.outputs.mode == 'sealed' || needs.assemble.result == 'success')
    needs: [inspect, assemble, review]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment:
      name: release-publish
    concurrency:
      group: release-atlas-core-publication
      cancel-in-progress: false
    permissions:
      actions: read
      attestations: read
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node and npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install release tools and exact npm
        run: |
          npm ci --workspace @atlas/atlas-core-release --ignore-scripts
          npm run build --workspace @atlas/atlas-core-release
          npm install --global --ignore-scripts "npm@$NPM_VERSION"
          npm --version | grep -Fx "$NPM_VERSION"

      - name: Download prepared candidate
        if: needs.inspect.outputs.mode == 'prepare'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-core-candidate-${{ needs.inspect.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle

      - name: Download sealed candidate
        if: needs.inspect.outputs.mode == 'sealed'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-core-sealed-${{ needs.inspect.outputs.version }}-${{ github.run_id }}
          path: bundle

      - name: Revalidate tag, workflow, and candidate identity
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.inspect.outputs.mode == 'prepare' && needs.assemble.outputs.artifact_digest || needs.inspect.outputs.handoff_digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ needs.inspect.outputs.mode }}
          SOURCE_SHA: ${{ needs.inspect.outputs.source_sha }}
          VERSION: ${{ needs.inspect.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --tags --force
          tag_object="$(node tools/atlas-core-release/dist/cli.js validate-release-tag --version "$VERSION" --source-sha "$SOURCE_SHA")"
          test "$tag_object" = "${{ needs.inspect.outputs.tag_object }}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          node tools/atlas-core-release/dist/cli.js verify-bundle --manifest bundle/release-manifest.json --root bundle
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg source "$SOURCE_SHA" \
            --arg tag "${{ needs.inspect.outputs.tag }}" --arg tag_object "$tag_object" \
            '.release.repository == $repository and .release.source_sha == $source and
             .release.tag_name == $tag and .release.tag_object == $tag_object' bundle/release-manifest.json >/dev/null
          test "$(jq -r .preparation.run_id bundle/release-manifest.json)" != ""
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [ "$MODE" = "prepare" ]; then
            artifact_name="atlas-core-candidate-$VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          else
            artifact_name="atlas-core-sealed-$VERSION-$GITHUB_RUN_ID"
          fi
          actual_artifact_digest="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"$artifact_name\" and .expired == false) | .digest")"
          test "$actual_artifact_digest" = "$EXPECTED_ARTIFACT_DIGEST"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | jq -e --arg sha "$SOURCE_SHA" \
            '.head_sha == $sha and .path == ".github/workflows/release-atlas-core.yml"' >/dev/null
          if [ "$MODE" = "prepare" ]; then
            test "$(jq -r .preparation.run_id bundle/release-manifest.json)" = "$GITHUB_RUN_ID"
            test "$(jq -r .preparation.run_attempt bundle/release-manifest.json)" = "$GITHUB_RUN_ATTEMPT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconcile and verify exact publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node tools/atlas-core-release/dist/cli.js reconcile-publication \
            --manifest bundle/release-manifest.json \
            --root bundle \
            > "$RUNNER_TEMP/publication-result.json"
          jq -e '.complete == true and .operations == []' "$RUNNER_TEMP/publication-result.json" >/dev/null

  verify-completed:
    name: Verify completed release without mutation
    if: needs.inspect.outputs.mode == 'complete'
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      packages: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install release tools and exact npm
        run: |
          npm ci --workspace @atlas/atlas-core-release --ignore-scripts
          npm run build --workspace @atlas/atlas-core-release
          npm install --global --ignore-scripts "npm@$NPM_VERSION"

      - name: Download immutable release bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.inspect.outputs.tag }}
        run: gh release download "$TAG" --dir bundle

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Verify public package, image, and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node tools/atlas-core-release/dist/cli.js verify-completed-publication \
            --manifest bundle/release-manifest.json \
            --root bundle \
            > "$RUNNER_TEMP/publication-result.json"
          jq -e '.complete == true and .operations == []' "$RUNNER_TEMP/publication-result.json" >/dev/null
          printf '## Atlas Core %s is complete\n\nAll sealed bytes and public identities match. No mutation was performed.\n' \
            "${{ needs.inspect.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Report observed final state
    if: always() && needs.inspect.result == 'success'
    needs: [inspect, publish, verify-completed]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - name: Report completion or partial publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ needs.inspect.outputs.mode }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          TAG: ${{ needs.inspect.outputs.tag }}
          VERIFY_COMPLETED_RESULT: ${{ needs.verify-completed.result }}
          VERSION: ${{ needs.inspect.outputs.version }}
        run: |
          release=absent
          npm_state=absent
          image=absent
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            release="$(jq -r '
              if .draft then "unsealed draft"
              elif (.immutable and .prerelease) then "sealed immutable prerelease"
              elif (.immutable and (.prerelease | not)) then "published immutable release"
              else "published but mutable conflict"
              end
            ' "$RUNNER_TEMP/release.json")"
          fi
          if npm view "atlas-core@$VERSION" dist.integrity >/dev/null 2>&1; then npm_state=published; fi
          if docker manifest inspect "$IMAGE_REPOSITORY:$VERSION" >/dev/null 2>&1; then image=published; fi
          verification=failed
          if { [ "$MODE" = complete ] && [ "$VERIFY_COMPLETED_RESULT" = success ]; } || \
             { [ "$MODE" != complete ] && [ "$PUBLISH_RESULT" = success ]; }; then
            verification=passed
          fi
          {
            printf '## Atlas Core %s observed state\n\n' "$VERSION"
            printf -- '- GitHub Release: %s\n' "$release"
            printf -- '- GHCR version tag: %s\n' "$image"
            printf -- '- npm version: %s\n' "$npm_state"
            printf -- '- Full verification: %s\n' "$verification"
            if [ "$verification" = passed ] && [ "$release" = "published immutable release" ] && \
               [ "$image" = published ] && [ "$npm_state" = published ]; then
              printf '%s\n' '- Next action: none; a future dispatch performs read-only verification.'
            else
              # shellcheck disable=SC2016
              printf -- '- Next action: dispatch Release Atlas Core from `%s` to reconcile the partial state.\n' "$TAG"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
