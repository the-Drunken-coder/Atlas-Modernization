name: Release Atlas Core
run-name: Atlas Core ${{ inputs.version }} from ${{ github.ref_name }} [coordinator ${{ inputs.coordinator_run_id || github.run_id }}/${{ inputs.coordinator_run_attempt || github.run_attempt }}]

on:
  workflow_dispatch:
    inputs:
      version:
        description: New stable SemVer from main, without v, for example 0.1.7
        required: true
        type: string
      recover_existing_release:
        description: Advanced recovery only, when this exact npm version already exists
        required: false
        default: false
        type: boolean
      coordinator_run_id:
        description: Internal coordinator run ID, leave empty when starting a release
        required: false
        default: ""
        type: string
      coordinator_run_attempt:
        description: Internal coordinator run attempt, leave empty when starting a release
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: release-atlas-core-${{ github.ref_type == 'tag' && github.ref_name || 'coordinator' }}
  cancel-in-progress: false
  queue: max

env:
  GO_VERSION_FILE: services/core/go.mod
  GO_SUM_FILE: services/core/go.sum
  NPM_VERSION: 11.6.2
  OPENCODE_VERSION: 1.18.21
  OPENCODE_MODEL: opencode-go/gpt-5.6-luna

jobs:
  changelog:
    name: Draft and validate changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.phase.outputs.mode }}
      recovery: ${{ steps.phase.outputs.recovery }}
      source_sha: ${{ steps.phase.outputs.source_sha }}
      release_sha: ${{ steps.phase.outputs.release_sha }}
      release_date: ${{ steps.release.outputs.release_date }}
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Validate and select release phase
        id: phase
        env:
          COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
          COORDINATOR_RUN_ATTEMPT: ${{ inputs.coordinator_run_attempt }}
          RECOVER_EXISTING_RELEASE: ${{ inputs.recover_existing_release }}
          VERSION: ${{ inputs.version }}
        run: |
          node .github/scripts/atlas-core-release.mjs validate-version "$VERSION"
          if [ -n "$COORDINATOR_RUN_ID" ] && [[ ! "$COORDINATOR_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "The internal coordinator run ID must contain only digits." >&2
            exit 1
          fi
          if [ -n "$COORDINATOR_RUN_ID" ] && [[ ! "$COORDINATOR_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "The internal coordinator run attempt must be a positive integer." >&2
            exit 1
          fi
          if [ -z "$COORDINATOR_RUN_ID" ] && [ -n "$COORDINATOR_RUN_ATTEMPT" ]; then
            echo "Leave both internal coordinator fields empty when starting a release." >&2
            exit 1
          fi
          if [ -n "$COORDINATOR_RUN_ID" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "Leave the internal coordinator run ID empty when dispatching from main." >&2
            exit 1
          fi
          expected_tag="refs/tags/atlas-core-v$VERSION"
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$GITHUB_REF" != "$expected_tag" ]; then
            echo "Dispatch Atlas Core releases from main or $expected_tag." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "The checked-out commit does not match the dispatched commit." >&2
            exit 1
          fi
          git fetch origin main --tags
          tag="atlas-core-v$VERSION"
          if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            current_version="$(node -p "require('./surfaces/core-cli/package.json').version")"
            node .github/scripts/atlas-core-release.mjs validate-next-version "$current_version" "$VERSION"
            latest_tag="$(git tag --list 'atlas-core-v*' --sort=-version:refname | head -n 1)"
            if [ -n "$latest_tag" ]; then
              node .github/scripts/atlas-core-release.mjs \
                validate-next-version "${latest_tag#atlas-core-v}" "$VERSION"
            fi
          fi
          bash .github/scripts/select-atlas-core-release-phase.sh

      - name: Require protected Atlas Core release tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/require-atlas-core-tag-rulesets.sh \
            "Create both active Atlas Core release tag rulesets before releasing."

      - name: Select changelog date
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          existing_date="$(node .github/scripts/atlas-core-release.mjs existing-date "$VERSION")"
          if [ -n "$existing_date" ]; then
            echo "already_prepared=true" >> "$GITHUB_OUTPUT"
            echo "release_date=$existing_date" >> "$GITHUB_OUTPUT"
          else
            echo "already_prepared=false" >> "$GITHUB_OUTPUT"
            echo "release_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build factual changelog context
        if: steps.phase.outputs.mode == 'prepare' && steps.release.outputs.already_prepared == 'false'
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ steps.release.outputs.release_date }}
        run: |
          previous_tag="$(git tag --list 'atlas-core-v*' --sort=-version:refname | head -n 1)"
          {
            echo "# Atlas Core release context"
            echo
            echo "Version: $VERSION"
            echo "Release date: $RELEASE_DATE"
            echo "Previous Atlas Core tag: ${previous_tag:-none}"
            echo
            echo "## Relevant commits"
            if [ -n "$previous_tag" ]; then
              git log --format='- %h %s' "$previous_tag..HEAD" -- \
                surfaces/core-cli services/core packages/protocol .github/workflows/release-atlas-core.yml
            else
              git log --max-count=100 --format='- %h %s' -- \
                surfaces/core-cli services/core packages/protocol .github/workflows/release-atlas-core.yml
            fi
            echo
            echo "## Relevant changed files"
            if [ -n "$previous_tag" ]; then
              git diff --name-status "$previous_tag..HEAD" -- \
                surfaces/core-cli services/core packages/protocol .github/workflows/release-atlas-core.yml
            else
              git ls-files surfaces/core-cli services/core packages/protocol .github/workflows/release-atlas-core.yml
            fi
          } > .atlas-core-release-context.md

      - name: Write changelog with OpenCode Go
        if: steps.phase.outputs.mode == 'prepare' && steps.release.outputs.already_prepared == 'false'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_DISABLE_AUTOUPDATE: "true"
          OPENCODE_DISABLE_DEFAULT_PLUGINS: "true"
          OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
          OPENCODE_PERMISSION: '{"bash":"deny","task":"deny","webfetch":"deny","websearch":"deny","question":"deny","edit":"allow","read":"allow","glob":"allow","grep":"allow","list":"allow","external_directory":"deny"}'
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ steps.release.outputs.release_date }}
        run: |
          prompt="$(cat <<EOF
          Edit CHANGELOG.md and no other file.

          Add a release section whose exact heading is:
          ## $VERSION - $RELEASE_DATE

          Keep every existing byte of CHANGELOG.md in place. If it has no existing release heading that starts with
          '## ', append the new section after the existing title and introduction with exactly one blank line before
          the new release heading. Otherwise, insert it immediately before the first existing release heading. Never
          place it before '# Changelog'.

          Read .atlas-core-release-context.md and the relevant repository files. Write concise operator-facing
          release notes using only facts you can verify. Use Markdown bullets. Add Added, Changed, Fixed, or Security
          subheadings only when they help. Mention commands, installation, storage safety, compatibility, and release
          behavior when they changed. Do not invent claims, use placeholders, discuss internal test work, or rewrite
          older release sections. Do not run commands. Stop after editing CHANGELOG.md.
          EOF
          )"
          npx --yes "opencode-ai@$OPENCODE_VERSION" run \
            --pure \
            --model "$OPENCODE_MODEL" \
            --title "Atlas Core $VERSION changelog" \
            "$prompt"

      - name: Validate isolated changelog
        if: steps.phase.outputs.mode == 'prepare'
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ steps.release.outputs.release_date }}
          ALREADY_PREPARED: ${{ steps.release.outputs.already_prepared }}
        run: |
          rm -f .atlas-core-release-context.md
          if [ "$ALREADY_PREPARED" = "false" ]; then
            changed="$(git diff --name-only)"
            if [ "$changed" != "CHANGELOG.md" ]; then
              echo "OpenCode must change only CHANGELOG.md. Changed files:" >&2
              printf '%s\n' "$changed" >&2
              exit 1
            fi
            untracked="$(git ls-files --others --exclude-standard)"
            if [ -n "$untracked" ]; then
              echo "OpenCode left unexpected files:" >&2
              printf '%s\n' "$untracked" >&2
              exit 1
            fi
            ignored="$(git ls-files --others --ignored --exclude-standard)"
            if [ -n "$ignored" ]; then
              echo "OpenCode left unexpected ignored files:" >&2
              printf '%s\n' "$ignored" >&2
              exit 1
            fi
          fi
          mkdir -p release-artifacts
          if [ "$ALREADY_PREPARED" = "false" ]; then
            original_changelog="$(mktemp)"
            git show HEAD:CHANGELOG.md > "$original_changelog"
            node .github/scripts/atlas-core-release.mjs \
              validate-changelog "$VERSION" "$RELEASE_DATE" release-artifacts/release-notes.md "$original_changelog"
            rm -f "$original_changelog"
          else
            node .github/scripts/atlas-core-release.mjs \
              validate-changelog "$VERSION" "$RELEASE_DATE" release-artifacts/release-notes.md
          fi

      - name: Upload isolated changelog
        if: steps.phase.outputs.mode == 'prepare'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-core-changelog-${{ inputs.version }}
          path: |
            CHANGELOG.md
            release-artifacts/release-notes.md
          if-no-files-found: error
          retention-days: 90

  prepare:
    name: Build approval artifact
    needs: changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download isolated changelog
        if: needs.changelog.outputs.mode == 'prepare'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-core-changelog-${{ inputs.version }}
          path: reviewed-changelog

      - name: Accept only the reviewed changelog artifact
        if: needs.changelog.outputs.mode == 'prepare'
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ needs.changelog.outputs.release_date }}
        run: |
          expected="$(printf '%s\n' CHANGELOG.md release-artifacts/release-notes.md | sort)"
          actual="$(find reviewed-changelog -type f -print | sed 's#^reviewed-changelog/##' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "The isolated changelog job returned unexpected files:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          cp reviewed-changelog/CHANGELOG.md CHANGELOG.md
          mkdir -p release-artifacts
          cp reviewed-changelog/release-artifacts/release-notes.md release-artifacts/release-notes.md
          if git diff --quiet -- CHANGELOG.md; then
            node .github/scripts/atlas-core-release.mjs \
              validate-changelog "$VERSION" "$RELEASE_DATE" release-artifacts/release-notes.md
          else
            original_changelog="$(mktemp)"
            git show HEAD:CHANGELOG.md > "$original_changelog"
            node .github/scripts/atlas-core-release.mjs \
              validate-changelog "$VERSION" "$RELEASE_DATE" release-artifacts/release-notes.md "$original_changelog"
            rm -f "$original_changelog"
          fi
          rm -rf reviewed-changelog

      - name: Prepare committed release notes
        if: needs.changelog.outputs.mode == 'publish'
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ needs.changelog.outputs.release_date }}
        run: |
          mkdir -p release-artifacts
          node .github/scripts/atlas-core-release.mjs \
            validate-changelog "$VERSION" "$RELEASE_DATE" release-artifacts/release-notes.md

      - name: Set up Go
        if: needs.changelog.outputs.mode == 'prepare'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_SUM_FILE }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install exact npm and Atlas Core dependencies
        run: |
          npm install --global --ignore-scripts "npm@$NPM_VERSION"
          npm --version | grep -Fx "$NPM_VERSION"
          npm ci --workspace atlas-core --ignore-scripts

      - name: Version the npm CLI
        if: needs.changelog.outputs.mode == 'prepare'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node .github/scripts/atlas-core-release.mjs prepare-package "$VERSION"
          npm version "$VERSION" --workspace atlas-core --no-git-tag-version --allow-same-version

      - name: Check versioned release inputs
        if: needs.changelog.outputs.mode == 'prepare'
        run: |
          npm audit --audit-level=high
          npm run check --workspace atlas-core
          node --test .github/scripts/atlas-core-release.test.mjs
          (cd packages/protocol && go run ./tools/check && go test ./...)
          (cd services/core && go test ./...)

      - name: Check immutable package inputs
        if: needs.changelog.outputs.mode == 'publish'
        run: |
          npm run check --workspace atlas-core
          git diff --exit-code

      - name: Pack the npm CLI
        if: github.ref_type != 'tag' || inputs.coordinator_run_id == ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm pack --workspace atlas-core \
            --pack-destination release-artifacts \
            --json \
            --silent > release-artifacts/npm-pack.json
          test -f "release-artifacts/atlas-core-$VERSION.tgz"
          (
            cd release-artifacts
            sha256sum "atlas-core-$VERSION.tgz" > SHA256SUMS
          )

      - name: Validate release diff
        if: needs.changelog.outputs.mode == 'prepare'
        run: |
          source .github/scripts/atlas-core-release-files.sh
          validate_atlas_core_release_paths "Unexpected release change" < <(git diff --name-only)
          git diff --check
          git diff -- "${atlas_core_release_paths[@]}" | tee release-artifacts/release.diff

      - name: Upload reviewed release
        if: github.ref_type != 'tag' || inputs.coordinator_run_id == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-core-${{ inputs.version }}
          path: |
            CHANGELOG.md
            package-lock.json
            surfaces/core-cli/package.json
            surfaces/core-cli/src/package-metadata.ts
            release-artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Summarize release gate
        env:
          COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
          MODE: ${{ needs.changelog.outputs.mode }}
          RECOVERY: ${{ needs.changelog.outputs.recovery }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.changelog.outputs.release_sha }}
          SOURCE_SHA: ${{ needs.changelog.outputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          printf '## Atlas Core %s release\n\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RECOVERY" = "true" ]; then
            {
              printf '%s\n' '- Phase: recover an existing published release with the current workflow.'
              printf -- '- Immutable release commit: %s\n' "$RELEASE_SHA"
              printf -- '- Review artifact: atlas-core-%s\n' "$VERSION"
              printf '%s\n' '- This approval may repair the GitHub Release. It cannot move the tag or publish a missing npm version.'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MODE" = "prepare" ]; then
            {
              printf '%s\n' '- Phase: prepare a new release from main.'
              printf -- '- Source commit: %s\n' "$SOURCE_SHA"
              printf -- '- Review artifact: atlas-core-%s\n' "$VERSION"
              printf '%s\n' '- Review release-artifacts/release.diff and the generated release notes.'
              printf '%s\n' '- Approval permits candidate image publication, disposable-host acceptance, the atomic release commit and tag push, and automatic public publication from the immutable tag.'
              printf '%s\n' '- This run waits for the tag run and reports the final publication result.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              printf -- '- Phase: publish immutable tag %s.\n' "$REF_NAME"
              printf -- '- Release commit: %s\n' "$RELEASE_SHA"
              printf -- '- Final artifact: atlas-core-%s\n' "$VERSION"
              if [ -n "$COORDINATOR_RUN_ID" ]; then
                printf -- '- Coordinator: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$COORDINATOR_RUN_ID"
              fi
              printf '%s\n' '- The immutable tag was approved before creation. This run completes or repairs its publication.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  authorize-tag-publication:
    name: Verify coordinator authorization
    if: github.ref_type == 'tag' && inputs.coordinator_run_id != ''
    needs: [changelog, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      package_integrity: ${{ steps.authorization.outputs.package_integrity }}
      release_artifact_digest: ${{ steps.authorization.outputs.release_artifact_digest }}
      release_artifact_id: ${{ steps.authorization.outputs.release_artifact_id }}
    steps:
      - name: Wait for coordinator authorization
        env:
          COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
          COORDINATOR_RUN_ATTEMPT: ${{ inputs.coordinator_run_attempt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          artifact_name="atlas-core-publication-authorization-$VERSION-$COORDINATOR_RUN_ID-$COORDINATOR_RUN_ATTEMPT"
          for attempt in $(seq 1 60); do
            artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COORDINATOR_RUN_ID/artifacts?per_page=100")"
            if jq -e --arg name "$artifact_name" \
              '.artifacts[] | select(.name == $name and .expired == false)' <<< "$artifacts" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "The coordinator authorization artifact was not uploaded after $attempt attempts." >&2
          exit 1

      - name: Download coordinator authorization
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "atlas-core-publication-authorization-${{ inputs.version }}-${{ inputs.coordinator_run_id }}-${{ inputs.coordinator_run_attempt }}"
          path: coordinator-authorization
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.coordinator_run_id }}

      - name: Verify coordinator authorization
        id: authorization
        env:
          CHILD_RUN_ID: ${{ github.run_id }}
          COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
          EXPECTED_COORDINATOR_RUN_ATTEMPT: ${{ inputs.coordinator_run_attempt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.changelog.outputs.release_sha }}
          SOURCE_SHA: ${{ needs.changelog.outputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          authorization="coordinator-authorization/publication-authorization.json"
          coordinator="$(mktemp)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COORDINATOR_RUN_ID" > "$coordinator"
          actual="$(find coordinator-authorization -type f -print)"
          if [ "$actual" != "$authorization" ]; then
            echo "The coordinator authorization artifact has unexpected files." >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          coordinator_run_attempt="$(
            jq -er '.coordinator_run_attempt | select(type == "string" and test("^[1-9][0-9]*$"))' \
              "$authorization"
          )"
          if [ "$coordinator_run_attempt" != "$EXPECTED_COORDINATOR_RUN_ATTEMPT" ]; then
            echo "The coordinator authorization identifies a different run attempt." >&2
            exit 1
          fi
          package_integrity="$(
            jq -er '.package_integrity | select(type == "string" and test("^sha512-[A-Za-z0-9+/]+={0,2}$"))' \
              "$authorization"
          )"
          release_artifact_digest="$(
            jq -er '.release_artifact_digest | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' \
              "$authorization"
          )"
          release_artifact_id="$(
            jq -er '.release_artifact_id | select(type == "string" and test("^[1-9][0-9]*$"))' \
              "$authorization"
          )"
          jq -e \
            --arg child_run_id "$CHILD_RUN_ID" \
            --arg coordinator_run_id "$COORDINATOR_RUN_ID" \
            --arg coordinator_run_attempt "$coordinator_run_attempt" \
            --arg package_integrity "$package_integrity" \
            --arg release_sha "$RELEASE_SHA" \
            --arg release_artifact_digest "$release_artifact_digest" \
            --arg release_artifact_id "$release_artifact_id" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            --arg tag "atlas-core-v$VERSION" \
            --arg version "$VERSION" \
            '. == {
              schema: 2,
              repository: $repository,
              workflow: "release-atlas-core.yml",
              coordinator_run_id: $coordinator_run_id,
              coordinator_run_attempt: $coordinator_run_attempt,
              child_run_id: $child_run_id,
              version: $version,
              tag: $tag,
              source_sha: $source_sha,
              release_sha: $release_sha,
              release_artifact_id: $release_artifact_id,
              release_artifact_digest: $release_artifact_digest,
              package_integrity: $package_integrity
            }' \
            "$authorization" >/dev/null
          jq -e \
            --arg coordinator_run_attempt "$coordinator_run_attempt" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            '.event == "workflow_dispatch" and
             .head_branch == "main" and
             .head_sha == $source_sha and
             .run_attempt == ($coordinator_run_attempt | tonumber) and
             .status == "in_progress" and
             .path == ".github/workflows/release-atlas-core.yml" and
             .repository.full_name == $repository' \
            "$coordinator" >/dev/null
          echo "package_integrity=$package_integrity" >> "$GITHUB_OUTPUT"
          echo "release_artifact_digest=$release_artifact_digest" >> "$GITHUB_OUTPUT"
          echo "release_artifact_id=$release_artifact_id" >> "$GITHUB_OUTPUT"

      - name: Verify exact coordinator package artifact
        env:
          COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
          COORDINATOR_RUN_ATTEMPT: ${{ inputs.coordinator_run_attempt }}
          EXPECTED_ARTIFACT_DIGEST: ${{ steps.authorization.outputs.release_artifact_digest }}
          EXPECTED_ARTIFACT_ID: ${{ steps.authorization.outputs.release_artifact_id }}
          EXPECTED_PACKAGE_INTEGRITY: ${{ steps.authorization.outputs.package_integrity }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          artifact="$(mktemp)"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT_ID" > "$artifact"
          jq -e \
            --arg digest "$EXPECTED_ARTIFACT_DIGEST" \
            --arg id "$EXPECTED_ARTIFACT_ID" \
            --arg name "atlas-core-final-$VERSION-$COORDINATOR_RUN_ID-$COORDINATOR_RUN_ATTEMPT" \
            --arg run_id "$COORDINATOR_RUN_ID" \
            '.id == ($id | tonumber) and
             .name == $name and
             .expired == false and
             .digest == $digest and
             .workflow_run.id == ($run_id | tonumber)' \
            "$artifact" >/dev/null
          archive="$RUNNER_TEMP/atlas-core-final.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT_ID/zip" > "$archive"
          actual_artifact_digest="sha256:$(sha256sum "$archive" | cut -d' ' -f1)"
          if [ "$actual_artifact_digest" != "$EXPECTED_ARTIFACT_DIGEST" ]; then
            echo "Coordinator artifact digest $actual_artifact_digest does not match $EXPECTED_ARTIFACT_DIGEST." >&2
            exit 1
          fi
          artifact_root="$RUNNER_TEMP/coordinator-release"
          mkdir -p "$artifact_root"
          unzip -q "$archive" -d "$artifact_root"
          package="$artifact_root/release-artifacts/atlas-core-$VERSION.tgz"
          test -f "$package"
          actual_package_integrity="sha512-$(openssl dgst -sha512 -binary "$package" | openssl base64 -A)"
          if [ "$actual_package_integrity" != "$EXPECTED_PACKAGE_INTEGRITY" ]; then
            echo "Coordinator package integrity does not match the approved publication." >&2
            exit 1
          fi

  approve-manual-tag-recovery:
    name: Approve manual tag recovery
    if: github.ref_type == 'tag' && inputs.coordinator_run_id == ''
    needs: [changelog, prepare]
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Record recovery approval
        env:
          VERSION: ${{ inputs.version }}
        run: printf 'Approved manual recovery for Atlas Core %s.\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Run approved release phase
    if: >-
      !cancelled() &&
      needs.changelog.result == 'success' &&
      needs.prepare.result == 'success' &&
      (needs.authorize-tag-publication.result == 'success' ||
      needs.authorize-tag-publication.result == 'skipped') &&
      (needs.approve-manual-tag-recovery.result == 'success' ||
      needs.approve-manual-tag-recovery.result == 'skipped')
    needs: [changelog, prepare, authorize-tag-publication, approve-manual-tag-recovery]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_type == 'tag' && 'release-publish' || 'release' }}
    concurrency:
      group: release-atlas-core-mutator
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write
    outputs:
      package_integrity: ${{ steps.final-package.outputs.package_integrity }}
      release_artifact_digest: sha256:${{ steps.final-artifact.outputs.artifact-digest }}
      release_artifact_id: ${{ steps.final-artifact.outputs.artifact-id }}
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download locally reviewed release
        if: github.ref_type != 'tag' || inputs.coordinator_run_id == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-core-${{ inputs.version }}
          path: .

      - name: Download coordinator-approved release
        if: github.ref_type == 'tag' && inputs.coordinator_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.authorize-tag-publication.outputs.release_artifact_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: coordinator-release
          repository: ${{ github.repository }}
          run-id: ${{ inputs.coordinator_run_id }}

      - name: Accept only the coordinator-approved release
        if: github.ref_type == 'tag' && inputs.coordinator_run_id != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if find coordinator-release -type l -print -quit | grep -q .; then
            echo "The coordinator release artifact contains a symbolic link." >&2
            exit 1
          fi
          while IFS= read -r path; do
            case "$path" in
              CHANGELOG.md|package-lock.json|surfaces/core-cli/package.json|surfaces/core-cli/src/package-metadata.ts|surfaces/core-cli/src/plugin-catalog.generated.ts|surfaces/core-cli/assets/plugin-catalog.json|surfaces/core-cli/assets/plugins/*|release-artifacts/atlas-core-$VERSION.tgz|release-artifacts/npm-pack.json|release-artifacts/SHA256SUMS|release-artifacts/release.diff|release-artifacts/release-notes.md)
                ;;
              *)
                echo "Unexpected coordinator release artifact file: $path" >&2
                exit 1
                ;;
            esac
          done < <(find coordinator-release -type f -print | sed 's#^coordinator-release/##' | sort)
          for path in \
            CHANGELOG.md \
            package-lock.json \
            surfaces/core-cli/package.json \
            surfaces/core-cli/src/package-metadata.ts \
            surfaces/core-cli/src/plugin-catalog.generated.ts \
            surfaces/core-cli/assets/plugin-catalog.json; do
            cmp "$path" "coordinator-release/$path"
          done
          diff --no-dereference --recursive \
            surfaces/core-cli/assets/plugins \
            coordinator-release/surfaces/core-cli/assets/plugins
          rm -rf release-artifacts
          cp -R coordinator-release/release-artifacts release-artifacts

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install exact npm
        run: |
          npm install --global --ignore-scripts "npm@$NPM_VERSION"
          npm --version | grep -Fx "$NPM_VERSION"

      - name: Install Atlas Core dependencies
        if: needs.changelog.outputs.mode == 'prepare'
        run: |
          npm ci --workspace atlas-core --ignore-scripts

      - name: Verify reviewed package
        env:
          EXPECTED_PACKAGE_INTEGRITY: ${{ needs.authorize-tag-publication.outputs.package_integrity }}
          VERSION: ${{ inputs.version }}
        run: |
          (
            cd release-artifacts
            sha256sum --check SHA256SUMS
          )
          package_version="$(node -p "require('./surfaces/core-cli/package.json').version")"
          if [ "$package_version" != "$VERSION" ]; then
            echo "Prepared package version $package_version does not match $VERSION." >&2
            exit 1
          fi
          if [ -n "$EXPECTED_PACKAGE_INTEGRITY" ]; then
            package="release-artifacts/atlas-core-$VERSION.tgz"
            actual_package_integrity="sha512-$(openssl dgst -sha512 -binary "$package" | openssl base64 -A)"
            if [ "$actual_package_integrity" != "$EXPECTED_PACKAGE_INTEGRITY" ]; then
              echo "Downloaded package integrity does not match the coordinator authorization." >&2
              exit 1
            fi
          fi

      - name: Revalidate release phase
        env:
          RECOVER_EXISTING_RELEASE: ${{ inputs.recover_existing_release }}
          VERSION: ${{ inputs.version }}
        run: |
          git fetch origin main --tags
          bash .github/scripts/select-atlas-core-release-phase.sh

      - name: Inspect npm publication state
        id: npm
        if: needs.changelog.outputs.mode == 'publish'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          package="release-artifacts/atlas-core-$VERSION.tgz"
          local_integrity="sha512-$(openssl dgst -sha512 -binary "$package" | openssl base64 -A)"
          version_error="$(mktemp)"
          if published_integrity="$(npm view "atlas-core@$VERSION" dist.integrity 2>"$version_error")"; then
            if [ "$published_integrity" != "$local_integrity" ]; then
              echo "atlas-core@$VERSION is already published with different contents." >&2
              exit 1
            fi
            package_exists=true
            version_exists=true
          elif grep -q 'E404' "$version_error"; then
            package_error="$(mktemp)"
            if npm view atlas-core name >/dev/null 2>"$package_error"; then
              package_exists=true
            elif grep -q 'E404' "$package_error"; then
              package_exists=false
            else
              cat "$package_error" >&2
              exit 1
            fi
            version_exists=false
          else
            cat "$version_error" >&2
            exit 1
          fi

          latest_stable=""
          if [ "$package_exists" = "true" ]; then
              latest_stable="$(
                npm view atlas-core versions --json |
                  jq -er '(if type == "array" then .[] else . end) |
                    select(type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' |
                  sort --version-sort |
                  tail -n 1
              )"
          fi
          publish_tag=latest
          make_latest=true
          if [ -n "$latest_stable" ]; then
            highest="$(printf '%s\n%s\n' "$latest_stable" "$VERSION" | sort --version-sort | tail -n 1)"
            if [ "$highest" = "$latest_stable" ] && [ "$latest_stable" != "$VERSION" ]; then
              publish_tag=recovered
              make_latest=false
            fi
          fi
          echo "integrity=$local_integrity" >> "$GITHUB_OUTPUT"
          echo "make_latest=$make_latest" >> "$GITHUB_OUTPUT"
          echo "package_exists=$package_exists" >> "$GITHUB_OUTPUT"
          echo "publish_tag=$publish_tag" >> "$GITHUB_OUTPUT"
          echo "version_exists=$version_exists" >> "$GITHUB_OUTPUT"

      - name: Require an existing npm version for main recovery
        if: needs.changelog.outputs.recovery == 'true' && steps.npm.outputs.version_exists != 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Main recovery cannot publish atlas-core@$VERSION with immutable-tag provenance." >&2
          echo "Dispatch the workflow from atlas-core-v$VERSION to publish an absent npm version." >&2
          exit 1

      - name: Verify coordinator remains active before public mutation
        if: github.ref_type == 'tag' && inputs.coordinator_run_id != ''
        env:
          COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COORDINATOR_RUN_ID" |
            jq -e --arg run_id "$COORDINATOR_RUN_ID" \
              '.id == ($run_id | tonumber) and .status == "in_progress"' >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: needs.changelog.outputs.mode == 'prepare'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Publish candidate Atlas Core image
        id: built_image
        if: needs.changelog.outputs.mode == 'prepare'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: services/core/docker/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/the-drunken-coder/atlas-core:candidate-${{ inputs.version }}-${{ github.sha }}
          cache-from: type=gha,scope=atlas-core-release
          cache-to: type=gha,mode=max,scope=atlas-core-release
          no-cache-filters: production
          labels: |
            org.opencontainers.image.source=https://github.com/the-Drunken-coder/Atlas-Modernization
            org.opencontainers.image.revision=${{ needs.changelog.outputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Publish candidate catalog Plugin images
        id: built_plugins
        if: needs.changelog.outputs.mode == 'prepare'
        env:
          SOURCE_SHA: ${{ needs.changelog.outputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          plan="$(node scripts/plugins.mjs release-plan)"
          images='{}'
          count="$(jq 'length' <<< "$plan")"
          for ((index = 0; index < count; index += 1)); do
            plugin_id="$(jq -r ".[$index].plugin_id" <<< "$plan")"
            repository="$(jq -r ".[$index].image_repository" <<< "$plan")"
            dockerfile="$(jq -r ".[$index].dockerfile" <<< "$plan")"
            target="$(jq -r ".[$index].docker_target" <<< "$plan")"
            metadata="$(mktemp)"
            docker buildx build . \
              --file "$dockerfile" \
              --target "$target" \
              --platform linux/amd64,linux/arm64 \
              --push \
              --tag "$repository:candidate-$VERSION-${{ github.sha }}" \
              --label org.opencontainers.image.source=https://github.com/the-Drunken-coder/Atlas-Modernization \
              --label "org.opencontainers.image.revision=$SOURCE_SHA" \
              --label "org.opencontainers.image.version=$VERSION" \
              --metadata-file "$metadata"
            digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$metadata")"
            images="$(jq -c --arg id "$plugin_id" --arg image "$repository@$digest" '. + {($id): $image}' <<< "$images")"
          done
          echo "images=$images" >> "$GITHUB_OUTPUT"

      - name: Select immutable Atlas Core image
        id: image
        env:
          BUILT_DIGEST: ${{ steps.built_image.outputs.digest }}
          MODE: ${{ needs.changelog.outputs.mode }}
        run: |
          if [ "$MODE" = "prepare" ]; then
            digest="$BUILT_DIGEST"
            reference="ghcr.io/the-drunken-coder/atlas-core@$digest"
          else
            reference="$(node -p "require('./surfaces/core-cli/package.json').atlasCoreImage || ''")"
            digest="${reference##*@}"
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || \
             [ "$reference" != "ghcr.io/the-drunken-coder/atlas-core@$digest" ]; then
            echo "Atlas Core did not produce a valid immutable image reference: $reference" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

      - name: Select immutable catalog Plugin images
        env:
          ATLAS_PLUGIN_IMAGES_JSON: ${{ steps.built_plugins.outputs.images }}
          MODE: ${{ needs.changelog.outputs.mode }}
        run: |
          if [ "$MODE" = "prepare" ]; then
            node scripts/plugins.mjs record-release-images --package-root surfaces/core-cli
          else
            node scripts/plugins.mjs verify-release-images --package-root surfaces/core-cli
          fi

      - name: Verify immutable Atlas Core image
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          SOURCE_SHA: ${{ needs.changelog.outputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          for platform in linux/amd64 linux/arm64; do
            config="$(
              docker buildx imagetools inspect "$IMAGE_REFERENCE" \
                --format "{{json (index .Image \"$platform\")}}"
            )"
            revision="$(jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' <<< "$config")"
            version="$(jq -r '.config.Labels["org.opencontainers.image.version"] // empty' <<< "$config")"
            if [ "$revision" != "$SOURCE_SHA" ] || [ "$version" != "$VERSION" ]; then
              echo "$IMAGE_REFERENCE has unexpected release labels for $platform." >&2
              exit 1
            fi
          done
          actual_digest="$(
            docker buildx imagetools inspect "$IMAGE_REFERENCE" --format '{{json .Manifest}}' |
              jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'
          )"
          if [ "$actual_digest" != "${IMAGE_REFERENCE##*@}" ]; then
            echo "$IMAGE_REFERENCE resolved to unexpected digest $actual_digest." >&2
            exit 1
          fi

      - name: Verify immutable catalog Plugin images
        env:
          SOURCE_SHA: ${{ needs.changelog.outputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          images="$(node -p 'JSON.stringify(require("./surfaces/core-cli/package.json").atlasPluginImages)')"
          count="$(jq 'length' <<< "$images")"
          for ((index = 0; index < count; index += 1)); do
            reference="$(jq -r "to_entries[$index].value" <<< "$images")"
            for platform in linux/amd64 linux/arm64; do
              config="$(docker buildx imagetools inspect "$reference" --format "{{json (index .Image \"$platform\")}}")"
              revision="$(jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' <<< "$config")"
              version="$(jq -r '.config.Labels["org.opencontainers.image.version"] // empty' <<< "$config")"
              if [ "$revision" != "$SOURCE_SHA" ] || [ "$version" != "$VERSION" ]; then
                echo "$reference has unexpected release labels for $platform." >&2
                exit 1
              fi
            done
            actual_digest="$(
              docker buildx imagetools inspect "$reference" --format '{{json .Manifest}}' |
                jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'
            )"
            if [ "$actual_digest" != "${reference##*@}" ]; then
              echo "$reference resolved to unexpected digest $actual_digest." >&2
              exit 1
            fi
          done

      - name: Record immutable image in the npm package
        if: needs.changelog.outputs.mode == 'prepare'
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          node - <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const path = "surfaces/core-cli/package.json";
          const packageJSON = JSON.parse(readFileSync(path, "utf8"));
          if (packageJSON.atlasCoreImage !== null) {
            throw new Error(`New release artifact already pins ${packageJSON.atlasCoreImage}`);
          }
          packageJSON.atlasCoreImage = process.env.IMAGE_REFERENCE;
          writeFileSync(path, `${JSON.stringify(packageJSON, null, 2)}\n`);
          NODE
          npm run check --workspace atlas-core
          git diff --check

      - name: Pack and test the exact CLI on a disposable Docker host
        id: final-package
        if: needs.changelog.outputs.mode == 'prepare'
        env:
          ATLAS_CORE_ACCEPTANCE_DISPOSABLE: "1"
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          VERSION: ${{ inputs.version }}
        run: |
            rm -f \
              "release-artifacts/atlas-core-$VERSION.tgz" \
              release-artifacts/npm-pack.json \
              release-artifacts/SHA256SUMS
            npm pack --workspace atlas-core \
              --pack-destination release-artifacts \
              --json \
              --silent > release-artifacts/npm-pack.json
            package="release-artifacts/atlas-core-$VERSION.tgz"
            test -f "$package"
            (
              cd release-artifacts
              sha256sum "atlas-core-$VERSION.tgz" > SHA256SUMS
            )
            package_integrity="sha512-$(openssl dgst -sha512 -binary "$package" | openssl base64 -A)"
            echo "package_integrity=$package_integrity" >> "$GITHUB_OUTPUT"
            bash .github/scripts/test-atlas-core-package.sh "$package" "$VERSION" "$IMAGE_REFERENCE"
            source .github/scripts/atlas-core-release-files.sh
            validate_atlas_core_release_paths "Unexpected final release change" < <(git diff --name-only)
            git diff --check
            git diff -- "${atlas_core_release_paths[@]}" > release-artifacts/release.diff

      - name: Verify release tag authority
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/require-atlas-core-tag-rulesets.sh \
            "Both Atlas Core release tag rulesets must remain active."

      - name: Verify immutable release tag
        if: needs.changelog.outputs.mode == 'publish'
        env:
          RELEASE_SHA: ${{ needs.changelog.outputs.release_sha }}
          VERSION: ${{ inputs.version }}
        run: bash .github/scripts/verify-atlas-core-release-tag.sh "$VERSION" "$RELEASE_SHA"

      - name: Upload exact approved release
        id: final-artifact
        if: needs.changelog.outputs.mode == 'prepare'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-core-final-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            CHANGELOG.md
            package-lock.json
            surfaces/core-cli/package.json
            surfaces/core-cli/src/package-metadata.ts
            surfaces/core-cli/src/plugin-catalog.generated.ts
            surfaces/core-cli/assets/plugin-catalog.json
            surfaces/core-cli/assets/plugins/
            release-artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Promote the reviewed digest to the version tag
        if: needs.changelog.outputs.mode == 'publish'
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          PINNED_DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          final_image="ghcr.io/the-drunken-coder/atlas-core:$VERSION"
          inspect_error="$(mktemp)"
          if final_digest="$(
            docker buildx imagetools inspect "$final_image" --format '{{json .Manifest}}' 2>"$inspect_error" |
              jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'
          )"; then
            if [ "$final_digest" != "$PINNED_DIGEST" ]; then
              echo "$final_image already identifies $final_digest, not $PINNED_DIGEST." >&2
              exit 1
            fi
          elif grep -Eiq 'manifest unknown|name unknown|not found' "$inspect_error"; then
            docker buildx imagetools create --tag "$final_image" "$IMAGE_REFERENCE"
          else
            cat "$inspect_error" >&2
            exit 1
          fi
          promoted_digest="$(
            docker buildx imagetools inspect "$final_image" --format '{{json .Manifest}}' |
              jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'
          )"
          if [ "$promoted_digest" != "$PINNED_DIGEST" ]; then
            echo "$final_image resolved to $promoted_digest after promotion." >&2
            exit 1
          fi

      - name: Promote catalog Plugin digests to the version tag
        if: needs.changelog.outputs.mode == 'publish'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          images="$(node -p 'JSON.stringify(require("./surfaces/core-cli/package.json").atlasPluginImages)')"
          count="$(jq 'length' <<< "$images")"
          for ((index = 0; index < count; index += 1)); do
            reference="$(jq -r "to_entries[$index].value" <<< "$images")"
            repository="${reference%@*}"
            pinned_digest="${reference##*@}"
            final_image="$repository:$VERSION"
            inspect_error="$(mktemp)"
            if final_digest="$(
              docker buildx imagetools inspect "$final_image" --format '{{json .Manifest}}' 2>"$inspect_error" |
                jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'
            )"; then
              if [ "$final_digest" != "$pinned_digest" ]; then
                echo "$final_image already identifies $final_digest, not $pinned_digest." >&2
                exit 1
              fi
            elif grep -Eiq 'manifest unknown|name unknown|not found' "$inspect_error"; then
              docker buildx imagetools create --tag "$final_image" "$reference"
            else
              cat "$inspect_error" >&2
              exit 1
            fi
            promoted_digest="$(
              docker buildx imagetools inspect "$final_image" --format '{{json .Manifest}}' |
                jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'
            )"
            if [ "$promoted_digest" != "$pinned_digest" ]; then
              echo "$final_image resolved to $promoted_digest after promotion." >&2
              exit 1
            fi
          done

      - name: Verify the exact image digest is publicly pullable
        if: needs.changelog.outputs.mode == 'publish'
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          images="$(node -p 'JSON.stringify([require("./surfaces/core-cli/package.json").atlasCoreImage, ...Object.values(require("./surfaces/core-cli/package.json").atlasPluginImages)])')"
          while IFS= read -r reference; do
            if ! docker manifest inspect "$reference" >/dev/null; then
              echo "$reference is not anonymously pullable." >&2
              echo "Make every Atlas Core release GHCR package public, then rerun this failed job before publishing npm." >&2
              exit 1
            fi
          done < <(jq -r '.[]' <<< "$images")

      - name: Create or verify draft GitHub Release
        if: needs.changelog.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="atlas-core-v$VERSION"
          package="release-artifacts/atlas-core-$VERSION.tgz"
          release_exists=false
          release_is_draft=true
          view_error="$(mktemp)"
          if gh release view "$tag" >/dev/null 2>"$view_error"; then
            release_exists=true
            release_is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [ "$(gh release view "$tag" --json name --jq .name)" != "Atlas Core $VERSION" ]; then
              echo "GitHub Release $tag has an unexpected title." >&2
              exit 1
            fi
            if [ "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" != "false" ]; then
              echo "GitHub Release $tag is unexpectedly marked as a prerelease." >&2
              exit 1
            fi
            if [ "$(gh release view "$tag" --json body --jq .body | sed 's/\r$//')" != \
                 "$(sed 's/\r$//' release-artifacts/release-notes.md)" ]; then
              echo "GitHub Release $tag has notes that do not match the reviewed artifact." >&2
              exit 1
            fi
          elif grep -qi 'release not found' "$view_error"; then
            gh release create "$tag" \
              --draft \
              --verify-tag \
              --title "Atlas Core $VERSION" \
              --notes-file release-artifacts/release-notes.md
          else
            cat "$view_error" >&2
            exit 1
          fi

          if [ "$release_exists" = "false" ] || [ "$release_is_draft" = "true" ]; then
            gh release upload "$tag" \
              "$package#atlas-core-$VERSION.tgz" \
              "release-artifacts/SHA256SUMS#SHA256SUMS" \
              --clobber
          fi

          expected_assets="$(printf '%s\n' SHA256SUMS "atlas-core-$VERSION.tgz" | sort)"
          actual_assets="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
          if [ "$actual_assets" != "$expected_assets" ]; then
            echo "GitHub Release $tag has an unexpected asset set." >&2
            exit 1
          fi
          downloaded="$(mktemp -d)"
          gh release download "$tag" \
            --dir "$downloaded" \
            --pattern "atlas-core-$VERSION.tgz" \
            --pattern SHA256SUMS
          cmp "$package" "$downloaded/atlas-core-$VERSION.tgz"
          cmp release-artifacts/SHA256SUMS "$downloaded/SHA256SUMS"

      - name: Reverify coordinator before npm publication
        if: github.ref_type == 'tag' && inputs.coordinator_run_id != ''
        env:
          COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COORDINATOR_RUN_ID" |
            jq -e --arg run_id "$COORDINATOR_RUN_ID" \
              '.id == ($run_id | tonumber) and .status == "in_progress"' >/dev/null

      - name: Bootstrap the npm package
        if: >-
          needs.changelog.outputs.recovery != 'true' &&
          steps.npm.outputs.version_exists == 'false' &&
          steps.npm.outputs.package_exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_TAG: ${{ steps.npm.outputs.publish_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "The first atlas-core release requires the short-lived NPM_TOKEN bootstrap secret." >&2
            exit 1
          fi
          npm publish "./release-artifacts/atlas-core-$VERSION.tgz" \
            --access public \
            --provenance \
            --tag "$PUBLISH_TAG"

      - name: Publish npm package through trusted publishing
        if: >-
          needs.changelog.outputs.recovery != 'true' &&
          steps.npm.outputs.version_exists == 'false' &&
          steps.npm.outputs.package_exists == 'true'
        env:
          PUBLISH_TAG: ${{ steps.npm.outputs.publish_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Trusted publication must not receive a token fallback." >&2
            exit 1
          fi
          npm publish "./release-artifacts/atlas-core-$VERSION.tgz" \
            --access public \
            --provenance \
            --tag "$PUBLISH_TAG"

      - name: Verify npm integrity, signatures, and provenance
        if: needs.changelog.outputs.mode == 'publish'
        env:
          EXPECTED_INTEGRITY: ${{ steps.npm.outputs.integrity }}
          RELEASE_SHA: ${{ needs.changelog.outputs.release_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          attestations="$(mktemp)"
          for attempt in $(seq 1 12); do
            published_integrity="$(npm view "atlas-core@$VERSION" dist.integrity 2>/dev/null || true)"
            attestation_url="$(npm view "atlas-core@$VERSION" dist.attestations.url 2>/dev/null || true)"
            if [ "$published_integrity" = "$EXPECTED_INTEGRITY" ] && \
              [ -n "$attestation_url" ] && \
              curl --connect-timeout 5 --max-time 15 --fail --silent --show-error \
                "$attestation_url" > "$attestations"; then
              break
            fi
            if [ "$attempt" = 12 ]; then
              echo "npm did not return the reviewed package and its provenance consistently." >&2
              exit 1
            fi
            sleep 5
          done
          node .github/scripts/atlas-core-release.mjs validate-npm-attestation \
            "$VERSION" \
            "$EXPECTED_INTEGRITY" \
            "$attestations" \
            "https://github.com/the-Drunken-coder/Atlas-Modernization" \
            ".github/workflows/release-atlas-core.yml" \
            "refs/tags/atlas-core-v$VERSION" \
            "$RELEASE_SHA"
          consumer="$(mktemp -d)"
          (
            cd "$consumer"
            npm init --yes --silent >/dev/null
            npm install --ignore-scripts "atlas-core@$VERSION" >/dev/null
            npm audit signatures
          )

      - name: Publish GitHub Release
        if: needs.changelog.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAKE_LATEST: ${{ steps.npm.outputs.make_latest }}
          RELEASE_SHA: ${{ needs.changelog.outputs.release_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="atlas-core-v$VERSION"
          bash .github/scripts/verify-atlas-core-release-tag.sh "$VERSION" "$RELEASE_SHA"
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "true" ]; then
            if [ "$MAKE_LATEST" = "true" ]; then
              gh release edit "$tag" --draft=false --latest
            else
              gh release edit "$tag" --draft=false --latest=false
            fi
          fi

  commit-release:
    name: Commit approved release
    if: >-
      !cancelled() &&
      needs.changelog.outputs.mode == 'prepare' &&
      needs.publish.result == 'success'
    needs: [changelog, publish]
    runs-on: ubuntu-latest
    environment: release-commit
    concurrency:
      group: release-atlas-core-mutator
      cancel-in-progress: false
      queue: max
    permissions:
      actions: write
      contents: write
    outputs:
      child_run_id: ${{ steps.dispatch.outputs.child_run_id }}
      child_url: ${{ steps.dispatch.outputs.child_url }}
      release_sha: ${{ steps.commit.outputs.release_sha }}
    steps:
      - name: Checkout exact approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.changelog.outputs.source_sha }}

      - name: Download exact approved release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.publish.outputs.release_artifact_id }}
          path: ${{ runner.temp }}/approved-release

      - name: Validate and stage only approved release files
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.publish.outputs.release_artifact_digest }}
          EXPECTED_ARTIFACT_ID: ${{ needs.publish.outputs.release_artifact_id }}
          EXPECTED_PACKAGE_INTEGRITY: ${{ needs.publish.outputs.package_integrity }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.changelog.outputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$EXPECTED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || \
             [[ ! "$EXPECTED_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || \
             [[ ! "$EXPECTED_PACKAGE_INTEGRITY" =~ ^sha512-[A-Za-z0-9+/]+={0,2}$ ]]; then
            echo "The approved release artifact outputs are malformed." >&2
            exit 1
          fi
          artifact="$(mktemp)"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT_ID" > "$artifact"
          jq -e \
            --arg digest "$EXPECTED_ARTIFACT_DIGEST" \
            --arg id "$EXPECTED_ARTIFACT_ID" \
            --arg name "atlas-core-final-$VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            '.id == ($id | tonumber) and
             .name == $name and
             .expired == false and
             .digest == $digest and
             .workflow_run.id == ($run_id | tonumber) and
             .workflow_run.head_sha == $source_sha' \
            "$artifact" >/dev/null

          artifact_root="$RUNNER_TEMP/approved-release"
          if find "$artifact_root" -type l -print -quit | grep -q .; then
            echo "The approved release artifact contains a symbolic link." >&2
            exit 1
          fi
          while IFS= read -r path; do
            case "$path" in
              CHANGELOG.md|package-lock.json|surfaces/core-cli/package.json|surfaces/core-cli/src/package-metadata.ts|surfaces/core-cli/src/plugin-catalog.generated.ts|surfaces/core-cli/assets/plugin-catalog.json|surfaces/core-cli/assets/plugins/*|release-artifacts/atlas-core-$VERSION.tgz|release-artifacts/npm-pack.json|release-artifacts/SHA256SUMS|release-artifacts/release.diff|release-artifacts/release-notes.md)
                ;;
              *)
                echo "Unexpected approved release artifact file: $path" >&2
                exit 1
                ;;
            esac
          done < <(find "$artifact_root" -type f -print | sed "s#^$artifact_root/##" | sort)
          for path in \
            CHANGELOG.md \
            package-lock.json \
            surfaces/core-cli/package.json \
            surfaces/core-cli/src/package-metadata.ts \
            surfaces/core-cli/src/plugin-catalog.generated.ts \
            surfaces/core-cli/assets/plugin-catalog.json \
            release-artifacts/atlas-core-$VERSION.tgz \
            release-artifacts/npm-pack.json \
            release-artifacts/SHA256SUMS \
            release-artifacts/release.diff \
            release-artifacts/release-notes.md; do
            test -f "$artifact_root/$path"
          done
          if ! find "$artifact_root/surfaces/core-cli/assets/plugins" -type f -print -quit | grep -q .; then
            echo "The approved release artifact contains no catalog Plugin assets." >&2
            exit 1
          fi
          (
            cd "$artifact_root/release-artifacts"
            sha256sum --check SHA256SUMS
          )
          package="$artifact_root/release-artifacts/atlas-core-$VERSION.tgz"
          actual_package_integrity="sha512-$(openssl dgst -sha512 -binary "$package" | openssl base64 -A)"
          if [ "$actual_package_integrity" != "$EXPECTED_PACKAGE_INTEGRITY" ]; then
            echo "The exact package does not match the approved integrity." >&2
            exit 1
          fi
          if [ "$(jq -er .version "$artifact_root/surfaces/core-cli/package.json")" != "$VERSION" ]; then
            echo "The approved package metadata has the wrong version." >&2
            exit 1
          fi

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$SOURCE_SHA" ]; then
            echo "main moved after release approval. Start a new release run." >&2
            exit 1
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          release_paths=(
            CHANGELOG.md
            package-lock.json
            surfaces/core-cli/package.json
            surfaces/core-cli/src/package-metadata.ts
            surfaces/core-cli/src/plugin-catalog.generated.ts
            surfaces/core-cli/assets/plugin-catalog.json
            surfaces/core-cli/assets/plugins
          )
          for path in "${release_paths[@]:0:6}"; do
            cp "$artifact_root/$path" "$path"
          done
          rm -rf surfaces/core-cli/assets/plugins
          cp -R "$artifact_root/surfaces/core-cli/assets/plugins" surfaces/core-cli/assets/plugins
          git -c core.hooksPath=/dev/null add -- "${release_paths[@]}"
          staged="$(git diff --cached --name-only)"
          if [ -z "$staged" ]; then
            echo "The approved release produced no commit changes." >&2
            exit 1
          fi
          while IFS= read -r path; do
            case "$path" in
              CHANGELOG.md|package-lock.json|surfaces/core-cli/package.json|surfaces/core-cli/src/package-metadata.ts|surfaces/core-cli/src/plugin-catalog.generated.ts|surfaces/core-cli/assets/plugin-catalog.json|surfaces/core-cli/assets/plugins/*)
                ;;
              *)
                echo "Unexpected staged release file: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$staged"
          git diff --cached --check
          actual_release_diff="$RUNNER_TEMP/release.diff"
          git diff --cached -- "${release_paths[@]}" > "$actual_release_diff"
          cmp "$artifact_root/release-artifacts/release.diff" "$actual_release_diff"
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Reverify release tag authority
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rulesets="$(mktemp)"
          gh api "repos/$GITHUB_REPOSITORY/rulesets?targets=tag&per_page=100" > "$rulesets"
          creation_id="$(
            jq -er '.[] | select(.name == "Atlas Core release tag creation" and .enforcement == "active") | .id' \
              "$rulesets" | head -n 1
          )"
          immutability_id="$(
            jq -er '.[] | select(.name == "Atlas Core release tag immutability" and .enforcement == "active") | .id' \
              "$rulesets" | head -n 1
          )"
          creation="$(mktemp)"
          immutability="$(mktemp)"
          gh api "repos/$GITHUB_REPOSITORY/rulesets/$creation_id" > "$creation"
          gh api "repos/$GITHUB_REPOSITORY/rulesets/$immutability_id" > "$immutability"
          jq -e '
            .name == "Atlas Core release tag creation" and
            .target == "tag" and
            .enforcement == "active" and
            .conditions.ref_name.include == ["refs/tags/atlas-core-v*"] and
            .conditions.ref_name.exclude == [] and
            ([.rules[].type] | index("creation") != null) and
            ([.rules[].type] | index("update") == null) and
            ([.rules[].type] | index("deletion") == null)
          ' "$creation" >/dev/null
          jq -e '
            .name == "Atlas Core release tag immutability" and
            .target == "tag" and
            .enforcement == "active" and
            .conditions.ref_name.include == ["refs/tags/atlas-core-v*"] and
            .conditions.ref_name.exclude == [] and
            ([.rules[].type] | index("creation") == null) and
            ([.rules[].type] | index("update") != null) and
            ([.rules[].type] | index("deletion") != null)
          ' "$immutability" >/dev/null

      - name: Mint protected release credential
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ATLAS_CORE_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ATLAS_CORE_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit and atomically tag release
        id: commit
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -c core.hooksPath=/dev/null -c commit.gpgSign=false \
            commit -m "chore(release): atlas-core v$VERSION"
          release_sha="$(git rev-parse HEAD)"
          tag="atlas-core-v$VERSION"
          git -c core.hooksPath=/dev/null -c tag.gpgSign=false \
            tag --annotate "$tag" --message "Atlas Core $VERSION" "$release_sha"
          gh auth setup-git
          git push --atomic origin HEAD:main "refs/tags/$tag:refs/tags/$tag"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch immutable tag publication
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="atlas-core-v$VERSION"
          request="$(
            jq -n \
              --arg coordinator_run_id "$GITHUB_RUN_ID" \
              --arg coordinator_run_attempt "$GITHUB_RUN_ATTEMPT" \
              --arg ref "$tag" \
              --arg version "$VERSION" \
              '{
                ref: $ref,
                inputs: {
                  version: $version,
                  coordinator_run_id: $coordinator_run_id,
                  coordinator_run_attempt: $coordinator_run_attempt
                },
                return_run_details: true
              }'
          )"
          response="$(
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/release-atlas-core.yml/dispatches" \
              --input - <<< "$request"
          )"
          child_run_id="$(jq -er '.workflow_run_id | tostring | select(test("^[0-9]+$"))' <<< "$response")"
          child_url="$(jq -er '.html_url | select(type == "string" and length > 0)' <<< "$response")"
          echo "child_run_id=$child_run_id" >> "$GITHUB_OUTPUT"
          echo "child_url=$child_url" >> "$GITHUB_OUTPUT"
          echo "Queued Atlas Core $VERSION publication from $tag as run $child_run_id."
          {
            printf '## Atlas Core %s release commit created\n\n' "$VERSION"
            printf -- '- Immutable tag: %s\n' "$tag"
            printf -- '- Immutable tag run: %s\n' "$child_url"
            printf '%s\n' '- The immutable tag run will publish the exact authorized package automatically.'
            printf '%s\n' '- This coordinator will wait for that exact run and report its result.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record approved publication
        env:
          CHILD_RUN_ID: ${{ steps.dispatch.outputs.child_run_id }}
          PACKAGE_INTEGRITY: ${{ needs.publish.outputs.package_integrity }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.publish.outputs.release_artifact_digest }}
          RELEASE_ARTIFACT_ID: ${{ needs.publish.outputs.release_artifact_id }}
          RELEASE_SHA: ${{ steps.commit.outputs.release_sha }}
          SOURCE_SHA: ${{ needs.changelog.outputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          authorization_root="$RUNNER_TEMP/publication-authorization"
          mkdir -p "$authorization_root"
          jq -n \
            --arg child_run_id "$CHILD_RUN_ID" \
            --arg coordinator_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg coordinator_run_id "$GITHUB_RUN_ID" \
            --arg package_integrity "$PACKAGE_INTEGRITY" \
            --arg release_artifact_digest "$RELEASE_ARTIFACT_DIGEST" \
            --arg release_artifact_id "$RELEASE_ARTIFACT_ID" \
            --arg release_sha "$RELEASE_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            --arg tag "atlas-core-v$VERSION" \
            --arg version "$VERSION" \
            '{
              schema: 2,
              repository: $repository,
              workflow: "release-atlas-core.yml",
              coordinator_run_id: $coordinator_run_id,
              coordinator_run_attempt: $coordinator_run_attempt,
              child_run_id: $child_run_id,
              version: $version,
              tag: $tag,
              source_sha: $source_sha,
              release_sha: $release_sha,
              release_artifact_id: $release_artifact_id,
              release_artifact_digest: $release_artifact_digest,
              package_integrity: $package_integrity
            }' > "$authorization_root/publication-authorization.json"

      - name: Upload approved publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-core-publication-authorization-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-authorization/publication-authorization.json
          if-no-files-found: error
          retention-days: 90

  await-publication:
    name: Await immutable tag publication
    if: >-
      !cancelled() &&
      needs.changelog.outputs.mode == 'prepare' &&
      needs.commit-release.outputs.child_run_id != ''
    needs: [changelog, commit-release]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Wait for tag publication
        id: wait
        env:
          CHILD_RUN_ID: ${{ needs.commit-release.outputs.child_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run watch "$CHILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

      - name: Summarize coordinated publication
        if: always()
        env:
          CHILD_URL: ${{ needs.commit-release.outputs.child_url }}
          VERSION: ${{ inputs.version }}
          WAIT_OUTCOME: ${{ steps.wait.outcome }}
        run: |
          printf '## Atlas Core %s publication\n\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$CHILD_URL" ]; then
            printf -- '- Immutable tag run: %s\n' "$CHILD_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$WAIT_OUTCOME" = "success" ]; then
            printf '%s\n' '- GHCR, npm, provenance, and the GitHub Release passed final verification.' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '- Immutable tag publication did not finish successfully. Open the linked run for the failing check.' >> "$GITHUB_STEP_SUMMARY"
          fi

  stop-publication:
    name: Stop publication after coordinator failure
    if: >-
      always() &&
      needs.changelog.outputs.mode == 'prepare' &&
      needs.commit-release.outputs.child_run_id != '' &&
      (cancelled() || needs.await-publication.result != 'success')
    needs: [changelog, commit-release, await-publication]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel the exact immutable tag run
        env:
          CHILD_RUN_ID: ${{ needs.commit-release.outputs.child_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion="$(gh run view "$CHILD_RUN_ID" --json conclusion --jq '.conclusion // ""')"
          if [ -n "$conclusion" ]; then
            if [ "$conclusion" = "success" ]; then
              echo "Immutable tag run $CHILD_RUN_ID completed before it could be cancelled." >&2
              exit 1
            fi
            echo "Immutable tag run $CHILD_RUN_ID already ended with $conclusion."
            exit 0
          fi
          gh run cancel "$CHILD_RUN_ID" || true
          for attempt in $(seq 1 30); do
            state="$(gh run view "$CHILD_RUN_ID" --json status,conclusion)"
            status="$(jq -r .status <<< "$state")"
            conclusion="$(jq -r '.conclusion // ""' <<< "$state")"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Immutable tag run $CHILD_RUN_ID published before cancellation completed." >&2
                exit 1
              fi
              echo "Immutable tag run $CHILD_RUN_ID ended with $conclusion."
              exit 0
            fi
            sleep 2
          done
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$CHILD_RUN_ID/force-cancel"
          for attempt in $(seq 1 30); do
            state="$(gh run view "$CHILD_RUN_ID" --json status,conclusion)"
            status="$(jq -r .status <<< "$state")"
            conclusion="$(jq -r '.conclusion // ""' <<< "$state")"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Immutable tag run $CHILD_RUN_ID published before force cancellation completed." >&2
                exit 1
              fi
              echo "Immutable tag run $CHILD_RUN_ID ended with $conclusion."
              exit 0
            fi
            sleep 2
          done
          echo "Immutable tag run $CHILD_RUN_ID did not reach a terminal cancelled state." >&2
          exit 1
