name: Nightly

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: Atlas_Core/go.mod
  GO_SUM_FILE: Atlas_Core/go.sum
  WORKING_DIRECTORY: Atlas_Core
  TRIVY_VERSION: v0.70.0

jobs:
  nightly:
    name: nightly
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_SUM_FILE }}

      - name: Run full Go test suite with race detector
        run: go test -count=1 -race ./...

      - name: Build production image for scanning
        run: docker build --target production -t atlas-core:nightly -f docker/Dockerfile .

      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: Atlas_Core
          trivy-config: ""
          version: ${{ env.TRIVY_VERSION }}
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan production Docker image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: atlas-core:nightly
          version: ${{ env.TRIVY_VERSION }}
          severity: HIGH,CRITICAL
          exit-code: "1"

  workflow-audit:
    name: workflow-audit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_SUM_FILE }}

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          advanced-security: false
          inputs: .github/workflows
          version: v1.25.2

  dependency-signal:
    name: dependency-signal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_SUM_FILE }}

      - name: List Go module updates
        run: go list -u -m all

      - name: Check Docker image references
        working-directory: .
        run: |
          grep -RInE 'FROM |image:' Atlas_Core/docker .github || true

      - name: Check GitHub Action references
        working-directory: .
        run: |
          grep -RInE 'uses: ' .github/workflows || true
