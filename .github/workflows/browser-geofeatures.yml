name: Browser Geofeature Acceptance

on:
  pull_request:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Browser coverage
        required: true
        default: required
        type: choice
        options:
          - required
          - nightly

permissions:
  contents: read

concurrency:
  group: browser-geofeatures-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.mode == 'nightly') && 'nightly' || 'required' }}
  cancel-in-progress: true

jobs:
  browser-geofeatures:
    name: browser-geofeatures-${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON((github.event_name == 'schedule' || inputs.mode == 'nightly') && '["chromium","webkit"]' || '["chromium"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript workspace dependencies
        run: npm ci

      - name: Install ${{ matrix.browser }} and system dependencies
        run: timeout 10m node node_modules/playwright/cli.js install --with-deps ${{ matrix.browser }}

      - name: Run ${{ matrix.browser }} Geofeature acceptance
        env:
          ATLAS_ACCEPTANCE_RUN_LABEL: ci-${{ matrix.browser }}
        run: npm run test:acceptance:browser-geofeatures -- --browser=${{ matrix.browser }}

      - name: Upload Geofeature acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-geofeatures-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .atlas/acceptance/browser-geofeatures-${{ matrix.browser }}/
          if-no-files-found: error
          retention-days: 14
