name: Browser Map Windows

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-map-windows-required:
    if: ${{ github.event_name != 'schedule' }}
    name: browser-map-windows-chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: browser-map-windows-required-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript workspace dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: timeout 10m node node_modules/playwright/cli.js install --with-deps chromium

      - name: Run Chromium map-window acceptance
        env:
          ATLAS_ACCEPTANCE_RUN_LABEL: ci-mapwin-chromium
        run: |
          timeout 10m npm run build:sdk
          timeout 20m node tests/acceptance/browser/map-windows.mjs --browser=chromium

      - name: Upload Chromium map-window evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-map-windows-chromium-${{ github.run_id }}-${{ github.run_attempt }}
          path: .atlas/acceptance/browser-map-windows-chromium/
          if-no-files-found: error
          retention-days: 14

  browser-map-windows-nightly:
    if: ${{ github.event_name == 'schedule' }}
    name: browser-map-windows-nightly-${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: browser-map-windows-nightly-${{ github.ref }}-${{ matrix.browser }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - webkit
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript workspace dependencies
        run: npm ci

      - name: Install ${{ matrix.browser }} and system dependencies
        run: timeout 10m node node_modules/playwright/cli.js install --with-deps ${{ matrix.browser }}

      - name: Run ${{ matrix.browser }} map-window acceptance
        env:
          ATLAS_ACCEPTANCE_RUN_LABEL: night-mapwin-${{ matrix.browser }}
        run: |
          timeout 10m npm run build:sdk
          timeout 20m node tests/acceptance/browser/map-windows.mjs --browser=${{ matrix.browser }}

      - name: Upload ${{ matrix.browser }} map-window evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-map-windows-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .atlas/acceptance/browser-map-windows-${{ matrix.browser }}/
          if-no-files-found: error
          retention-days: 14
