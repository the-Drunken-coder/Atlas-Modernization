name: Meshtastic Link acceptance

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 8 * * *"

permissions:
  contents: read

concurrency:
  group: meshtastic-link-acceptance-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  process-acceptance:
    name: process-acceptance-${{ matrix.case }}-${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'schedule' && '[{"case":"required","seed":39001,"fault":""},{"case":"private-drop-recovery","seed":39002,"fault":"drop-asset-private-packets"}]' || '[{"case":"required","seed":390,"fault":""}]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript workspace dependencies
        run: npm ci

      - name: Run compiled Link process acceptance
        env:
          ATLAS_LINK_ACCEPTANCE_ARTIFACTS: ${{ runner.temp }}/atlas-link-acceptance
          ATLAS_LINK_ACCEPTANCE_FAULT: ${{ matrix.fault }}
          ATLAS_LINK_ACCEPTANCE_MODE: ${{ github.event_name == 'schedule' && 'nightly' || 'required' }}
          ATLAS_LINK_ACCEPTANCE_SEED: ${{ matrix.seed }}
        run: npm run test:acceptance --workspace @the-drunken-coder/atlas-meshtastic-link

      - name: Upload Link acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meshtastic-link-process-acceptance-${{ runner.os }}-${{ matrix.case }}-${{ matrix.seed }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/atlas-link-acceptance
          if-no-files-found: error
          retention-days: 14
