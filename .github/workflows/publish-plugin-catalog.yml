name: Publish Atlas Plugin Catalog

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-atlas-plugin-mutator
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Renew signed Plugin catalog
    runs-on: ubuntu-latest
    environment: plugin-catalog
    permissions:
      contents: write
      id-token: write
      pages: write
    steps:
      - name: Checkout publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Require the configured catalog signing key
        env:
          ATLAS_PLUGIN_CATALOG_KEY_EPOCH: ${{ vars.ATLAS_PLUGIN_CATALOG_KEY_EPOCH }}
          ATLAS_PLUGIN_CATALOG_KEY_ID: ${{ vars.ATLAS_PLUGIN_CATALOG_KEY_ID }}
          ATLAS_PLUGIN_CATALOG_PRIVATE_KEY: ${{ secrets.ATLAS_PLUGIN_CATALOG_PRIVATE_KEY }}
        run: node scripts/plugin-release-catalog.mjs preflight

      - name: Checkout the protected catalog ledger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: plugin-catalog
          path: catalog-ledger
          persist-credentials: false

      - name: Renew and sign the catalog ledger
        env:
          ATLAS_PLUGIN_CATALOG_KEY_EPOCH: ${{ vars.ATLAS_PLUGIN_CATALOG_KEY_EPOCH }}
          ATLAS_PLUGIN_CATALOG_KEY_ID: ${{ vars.ATLAS_PLUGIN_CATALOG_KEY_ID }}
          ATLAS_PLUGIN_CATALOG_PRIVATE_KEY: ${{ secrets.ATLAS_PLUGIN_CATALOG_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -C catalog-ledger remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          node scripts/plugin-release-catalog.mjs renew catalog-ledger
          git -C catalog-ledger config user.name "atlas-plugin-catalog[bot]"
          git -C catalog-ledger config user.email "atlas-plugin-catalog[bot]@users.noreply.github.com"
          git -C catalog-ledger add catalog.json catalog.json.sig
          git -C catalog-ledger commit -m "catalog: renew signed catalog"
          git -C catalog-ledger push origin HEAD:plugin-catalog

      - name: Build the Pages artifact from the ledger commit
        run: |
          mkdir -p pages
          cp catalog-ledger/catalog.json catalog-ledger/catalog.json.sig pages/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages

      - name: Publish Pages artifact
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify stable catalog publication
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: node scripts/plugin-release-catalog.mjs verify-published catalog-ledger
