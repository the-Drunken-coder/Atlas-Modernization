name: Simulation scenario acceptance

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulation-scenarios-acceptance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-scenarios:
    name: ${{ matrix.scenario }}-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - observations-objects
          - observations-late-assertions
          - multi-client-sync
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript workspace dependencies
        run: npm ci

      - name: Run required simulation scenario acceptance
        run: npm run build:sdk && node tests/acceptance/simulations/${{ matrix.scenario }}.mjs

      - name: Upload acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.scenario }}-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .atlas/acceptance/simulations-${{ matrix.scenario }}/
          if-no-files-found: error
          retention-days: 14

  nightly-cardinality-and-faults:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    name: ${{ matrix.scenario }}-nightly-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - observations-objects
          - multi-client-sync
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript workspace dependencies
        run: npm ci

      - name: Run expanded simulation scenario and input fault
        env:
          ATLAS_ACCEPTANCE_NIGHTLY: "1"
        run: npm run build:sdk && node tests/acceptance/simulations/${{ matrix.scenario }}.mjs

      - name: Upload nightly acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.scenario }}-nightly-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .atlas/acceptance/simulations-${{ matrix.scenario }}/
          if-no-files-found: error
          retention-days: 14
