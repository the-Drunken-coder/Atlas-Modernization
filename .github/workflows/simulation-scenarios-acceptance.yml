name: Simulation scenario acceptance

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulation-scenarios-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-scenarios:
    name: ${{ matrix.scenario }}-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - observations-objects
          - multi-client-sync
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript workspace dependencies
        run: npm ci

      - name: Run required simulation scenario acceptance
        run: npm run build:sdk && node tests/acceptance/simulations/${{ matrix.scenario }}.mjs

      - name: Upload acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.scenario }}-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .atlas/acceptance/simulations-${{ matrix.scenario }}/
          if-no-files-found: error
          retention-days: 14

  nightly-cardinality-and-faults:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript workspace dependencies
        run: npm ci

      - name: Run expanded simulation scenarios and input faults
        env:
          ATLAS_ACCEPTANCE_NIGHTLY: "1"
        run: |
          npm run build:sdk
          node tests/acceptance/simulations/observations-objects.mjs
          node tests/acceptance/simulations/multi-client-sync.mjs

      - name: Upload nightly acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulation-scenarios-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .atlas/acceptance/simulations-observations-objects/
            .atlas/acceptance/simulations-multi-client-sync/
          if-no-files-found: error
          retention-days: 14
