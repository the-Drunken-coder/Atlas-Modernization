name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            query-suite: ./.github/codeql/actions-max.qls
          - language: go
            build-mode: manual
            query-suite: ./.github/codeql/go-max.qls
          - language: javascript-typescript
            build-mode: none
            query-suite: ./.github/codeql/javascript-max.qls
          - language: python
            build-mode: none
            query-suite: ./.github/codeql/python-max.qls

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: Atlas_Core/go.mod
          cache-dependency-path: |
            Atlas_Core/go.sum
            atlas_protocol/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: ${{ matrix.query-suite }}

      - name: Build Go modules
        if: matrix.build-mode == 'manual'
        run: |
          (cd atlas_protocol && go test ./...)
          (cd Atlas_Core && go test ./...)

      - name: Analyze
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: /language:${{ matrix.language }}
