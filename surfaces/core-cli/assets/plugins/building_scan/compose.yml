services:
  api:
    environment:
      ATLAS_PLUGIN_CONFIG_DIR: /app/plugin-endpoints
    volumes:
      - ${ATLAS_PLUGIN_CONFIG_ROOT:-../../../plugins}/building_scan/core-endpoint.json:/app/plugin-endpoints/building_scan.json:ro

  source-gateway:
    environment:
      ATLAS_SOURCE_CONNECTOR_CONFIG_DIR: /app/source-connectors
    volumes:
      - ${ATLAS_PLUGIN_CONFIG_ROOT:-../../../plugins}/building_scan/source-connector.json:/app/source-connectors/building_scan.json:ro

  building-scan-plugin:
    image: "ghcr.io/the-drunken-coder/atlas-building-scan@sha256:3bb8c7d7761c71fa1a9fb399b275a26686b2c7d39b9be2a2292797284f2f2b25"
    container_name: ${ATLAS_CORE_PROJECT:-atlas_core_production}_building_scan_plugin
    labels:
      io.atlas.core.engine: ${ATLAS_CORE_ENGINE_ID:-direct-compose}
    restart: unless-stopped
    environment:
      ATLAS_SOURCE_GATEWAY_ORIGIN: http://source-gateway:8080
    depends_on:
      source-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atlas_core_network
